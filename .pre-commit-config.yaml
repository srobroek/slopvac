repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uvx ruff@0.16.3 check packages/slopvac-lint
        language: system
        pass_filenames: false
        files: ^packages/slopvac-lint/.*\.py$
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
        files: ^(crates/.*\.rs|Cargo\.toml|rustfmt\.toml)$
      - id: cargo-sort
        name: cargo sort
        entry: scripts/rust-hook.sh cargo-sort --workspace --check
        language: system
        pass_filenames: false
        files: (^|/)Cargo\.toml$
      - id: cargo-shear
        name: cargo shear
        entry: scripts/rust-hook.sh cargo-shear
        language: system
        pass_filenames: false
        files: (^|/)Cargo\.(toml|lock)$|^crates/.*\.rs$
      - id: cargo-deny
        name: cargo deny
        entry: scripts/rust-hook.sh cargo-deny --locked check licenses bans sources
        language: system
        pass_filenames: false
        files: ^(Cargo\.(toml|lock)|deny\.toml|crates/.*/Cargo\.toml)$
      - id: typos
        name: typos
        entry: scripts/rust-hook.sh typos --force-exclude
        language: system
        files: \.(rs|toml|md)$
      - id: taplo
        name: taplo fmt
        entry: scripts/rust-hook.sh taplo fmt --check
        language: system
        files: \.toml$
      - id: ast-grep
        name: ast-grep message checks
        entry: scripts/rust-hook.sh ast-grep test
        language: system
        pass_filenames: false
        files: ^(sgconfig\.yml|ast-grep/.*|crates/.*\.rs)$
      - id: ast-grep-scan
        name: ast-grep scan
        entry: scripts/rust-hook.sh ast-grep scan
        language: system
        pass_filenames: false
        files: ^(sgconfig\.yml|ast-grep/.*|crates/.*\.rs)$
      - id: tag-roots
        name: tag roots
        entry: python3 scripts/ci/check_tag_roots.py --pre-push
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
