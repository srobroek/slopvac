name: slopvac
version: 1.0.0
description: >-
  Remove AI writing patterns from prose. Two skills -- write-docs authors a
  document against its genre's rules, review-docs gates the result and returns a
  verdict -- over a deterministic Vale gate, plus hooks that carry the same
  rules into every subagent and every edit. Requires the vale binary on PATH.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
category: docs
tags:
  - skill
  - docs
  - writing
  - linting
  - prose
scripts:
  build-styles: ./vale-styles/build.sh
  slop-lint: bash .apm/skills/review-docs/scripts/slop-lint.sh
  init-vale: bash .apm/skills/review-docs/scripts/init-vale.sh
  test: python3 -m pytest tests .apm/skills/review-docs/tests -q
marketplace:
  outputs:
    claude: {}
    codex: {}
  versioning:
    strategy: tag_pattern
  build:
    tagPattern: '{name}--v{version}'
