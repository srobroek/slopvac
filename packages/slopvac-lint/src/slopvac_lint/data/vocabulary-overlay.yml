# The only place this project deviates from the extracted ASD base layer.
#
# Every entry states a direction and a reason. Read this file to see our complete
# editorial contribution; the base layer is unmodified.
#
# direction:
#   reversal   - the base marks it unapproved, we approve it for software prose
#   addition   - the base has no entry, we add one
#   restriction- the base approves it, we refuse it for software prose
#
# An entry that overwrites a base key must carry a reason. The build fails without one.
# Size limit: about 80 entries. Past that, we have started re-curating the base and the
# reviewability of this file is gone.

issue: 9
base: ASD-STE100 Issue 9 dictionary, as extracted
entries:

  # --- Reversals: build and release actions -------------------------------------
  # The base refuses these verbs because in an aerospace context they were vague.
  # In software prose each names one specified process, which is the domain-verb test.

  - word: build
    pos: verb
    status: approved
    direction: reversal
    reason: Names one process (source to artifact); no vocabulary verb covers it.

  - word: build
    pos: noun
    status: approved
    direction: reversal
    reason: Names the artifact and the CI run that produced it.

  - word: compile
    pos: verb
    status: approved
    direction: reversal
    reason: Names a specific transformation, narrower than "build".

  - word: run
    pos: verb
    status: approved
    direction: reversal
    reason: The standard verb for starting a command; "operate" misreads on a CLI.

  - word: execute
    pos: verb
    status: unapproved
    replacement: run
    direction: restriction
    reason: Base already refuses it and we agree; "run" is shorter and unambiguous.

  - word: deploy
    pos: noun
    status: unapproved
    replacement: deployment
    direction: addition
    reason: The verb is approved in the base; the noun form is verb-as-noun.

  - word: release
    pos: noun
    status: approved
    direction: addition
    reason: Base approves the verb only; the noun names a versioned artifact.

  - word: lint
    pos: verb
    status: approved
    direction: addition
    reason: Names a specific check process with no vocabulary equivalent.

  - word: package
    pos: noun
    status: approved
    direction: addition
    reason: Distribution unit; the central noun of dependency documentation.

  - word: publish
    pos: verb
    status: approved
    direction: addition
    reason: Names sending a package to a registry.

  # --- Reversals: version control -----------------------------------------------

  - word: branch
    pos: noun
    status: approved
    direction: addition
    reason: Version-control object; the base has only the (refused) verb.

  - word: branch
    pos: verb
    status: unapproved
    replacement: create a branch
    direction: reversal
    reason: Keep the base refusal. The noun is the object; the verb reads ambiguously.

  - word: commit
    pos: noun
    status: approved
    direction: addition
    reason: Version-control object with no vocabulary word for it.

  - word: commit
    pos: verb
    status: approved
    direction: addition
    reason: Names one specific action on a repository.

  - word: merge
    pos: noun
    status: approved
    direction: addition
    reason: Version-control operation and its result.

  - word: merge
    pos: verb
    status: approved
    direction: addition
    reason: Names combining two branches; no vocabulary verb covers it.

  - word: rebase
    pos: verb
    status: approved
    direction: addition
    reason: Distinct from merge; the difference matters to the reader.

  - word: revert
    pos: verb
    status: approved
    direction: addition
    reason: Names undoing a commit; "roll back" is a phrasal verb we refuse.

  - word: clone
    pos: verb
    status: approved
    direction: addition
    reason: Names copying a repository with its history.

  - word: diff
    pos: noun
    status: approved
    direction: addition
    reason: Names the artifact. The verb use is refused by the noun-as-verb rule.

  - word: repository
    pos: noun
    status: approved
    direction: addition
    reason: Core version-control noun.

  # --- Reversals: interfaces, requests, and data --------------------------------

  - word: request
    pos: noun
    status: approved
    direction: reversal
    reason: The central noun of API documentation; the base refusal is aerospace-specific.

  - word: request
    pos: verb
    status: unapproved
    replacement: send a request
    direction: reversal
    reason: Keep the base refusal for the verb; the noun carries the meaning.

  - word: response
    pos: noun
    status: approved
    direction: addition
    reason: Pairs with request; absent from the base.

  - word: endpoint
    pos: noun
    status: approved
    direction: addition
    reason: Names an addressable interface; no vocabulary word for it.

  - word: route
    pos: noun
    status: approved
    direction: reversal
    reason: Names a path-to-handler mapping, a specified concept in web frameworks.

  - word: header
    pos: noun
    status: approved
    direction: addition
    reason: Protocol field with a fixed meaning.

  - word: payload
    pos: noun
    status: approved
    direction: addition
    reason: Names the body of a message.

  - word: token
    pos: noun
    status: approved
    direction: addition
    reason: Credential object; central to authentication documentation.

  - word: webhook
    pos: noun
    status: approved
    direction: addition
    reason: Named integration mechanism with no plainer term.

  - word: query
    pos: noun
    status: approved
    direction: addition
    reason: Names a database or search request.

  - word: schema
    pos: noun
    status: approved
    direction: addition
    reason: Names a structure definition; "structure" is too broad.

  - word: index
    pos: noun
    status: approved
    direction: addition
    reason: Database and search object.

  - word: field
    pos: noun
    status: approved
    direction: addition
    reason: Names one member of a record or a form.

  - word: key
    pos: noun
    status: approved
    direction: addition
    reason: Names a map key and a credential; the base has only the refused verb.

  - word: key
    pos: verb
    status: unapproved
    replacement: type
    direction: reversal
    reason: Keep the base refusal; "key" as a verb is dated and ambiguous.

  - word: cache
    pos: noun
    status: approved
    direction: addition
    reason: Named storage layer with no vocabulary equivalent.

  - word: cache
    pos: verb
    status: approved
    direction: addition
    reason: Names storing a value for reuse; a paraphrase is longer and less clear.

  - word: snapshot
    pos: noun
    status: approved
    direction: addition
    reason: Names a point-in-time copy.

  - word: migration
    pos: noun
    status: approved
    direction: addition
    reason: Names a schema-change unit, not a general move.

  - word: partition
    pos: noun
    status: approved
    direction: addition
    reason: Data-distribution unit; also a network-failure mode.

  - word: shard
    pos: noun
    status: approved
    direction: addition
    reason: Distinct from partition in most systems; the difference is documented.

  - word: bucket
    pos: noun
    status: approved
    direction: addition
    reason: Object-storage container; the term users see in every console.

  # --- Reversals: runtime, logging, and operations ------------------------------

  - word: log
    pos: noun
    status: approved
    direction: addition
    reason: Names the output stream and the file.

  - word: log
    pos: verb
    status: approved
    direction: reversal
    reason: Names writing one record; "write to the log" is longer with no gain.

  - word: enable
    pos: verb
    status: approved
    direction: reversal
    reason: The base's own domain-verb category for computer processes names it.

  - word: disable
    pos: verb
    status: approved
    direction: addition
    reason: Pairs with enable; the base names it as a computer-process verb.

  - word: call
    pos: verb
    status: approved
    direction: reversal
    reason: Names invoking a function or an API; the standard term of art.

  - word: call
    pos: noun
    status: approved
    direction: addition
    reason: Names one invocation, as in a call stack or a rate limit.

  - word: job
    pos: noun
    status: approved
    direction: reversal
    reason: Names a scheduled unit of work; "task" alone cannot carry both senses.

  - word: stage
    pos: noun
    status: approved
    direction: reversal
    reason: Names one step of a pipeline, a specified concept in CI.

  - word: retry
    pos: noun
    status: approved
    direction: addition
    reason: Names one repeated attempt; central to reliability documentation.

  - word: retry
    pos: verb
    status: approved
    direction: addition
    reason: A paraphrase such as 'do it again' loses the automatic sense.

  - word: timeout
    pos: noun
    status: approved
    direction: addition
    reason: Named limit with a numeric value.

  - word: throttle
    pos: verb
    status: approved
    direction: addition
    reason: Names rate limiting; distinct from stopping.

  - word: drain
    pos: verb
    status: approved
    direction: addition
    reason: Base approves it already; recorded here for the queue sense.

  - word: evict
    pos: verb
    status: approved
    direction: addition
    reason: Names cache and scheduler removal; "remove" loses the involuntary sense.

  - word: reconcile
    pos: verb
    status: approved
    direction: addition
    reason: Names the control-loop action; no vocabulary verb covers it.

  - word: expire
    pos: verb
    status: approved
    direction: addition
    reason: Names a credential or cache entry becoming invalid by time.

  # --- Reversals: topology and files --------------------------------------------

  - word: node
    pos: noun
    status: approved
    direction: addition
    reason: Names a machine in a cluster and a tree element.

  - word: cluster
    pos: noun
    status: approved
    direction: addition
    reason: Names a set of cooperating machines.

  - word: replica
    pos: noun
    status: approved
    direction: addition
    reason: Names one copy of a running service or a database.

  - word: region
    pos: noun
    status: approved
    direction: addition
    reason: Cloud-provider topology unit.

  - word: environment
    pos: noun
    status: approved
    direction: addition
    reason: Names a deployment target such as staging or production.

  - word: tenant
    pos: noun
    status: approved
    direction: addition
    reason: Names an isolated customer in a shared system.

  - word: namespace
    pos: noun
    status: approved
    direction: addition
    reason: Named isolation boundary; also a language construct.

  - word: file
    pos: noun
    status: approved
    direction: addition
    reason: The base has only the refused verb; the noun is unavoidable.

  - word: file
    pos: verb
    status: unapproved
    replacement: put in a file
    direction: reversal
    reason: Keep the base refusal; the verb reads as a legal filing.

  - word: directory
    pos: noun
    status: approved
    direction: addition
    reason: Filesystem object; "folder" is the alternative we do not use.

  - word: config
    pos: noun
    status: approved
    direction: addition
    reason: Names the file and the settings; shorter than "configuration" and standard.

  - word: return
    pos: verb
    status: approved
    direction: reversal
    reason: Names a function producing a value; the term of art in every API reference.

  - word: return
    pos: noun
    status: unapproved
    replacement: return value
    direction: reversal
    reason: Keep the base refusal for the bare noun; it is ambiguous alone.

  # --- Restrictions: the base is more permissive than we want -------------------

  - word: simple
    pos: adjective
    status: unapproved
    replacement: null
    direction: restriction
    reason: Judges the reader's experience rather than describing the thing. Delete it.

  - word: easy
    pos: adjective
    status: unapproved
    replacement: null
    direction: restriction
    reason: Same failure as "simple"; state the step count instead.

  - word: quickly
    pos: adverb
    status: unapproved
    replacement: null
    direction: restriction
    reason: Unmeasurable in documentation. Give the duration.

  - word: correctly
    pos: adverb
    status: unapproved
    replacement: null
    direction: restriction
    reason: Tells the reader nothing about what correct means. State the condition.
