id: ste-descriptive
title: STE Descriptive Writing
description: Governs information order, connective structure, sentence length, and paragraph shape in explanatory text.
weight: 1.0
max_per_100_words:
  strict: 1.0
  normal: 1.5
recommended_for: [reference]
rules:
  - id: sentence-too-long-descriptive
    name: Keep an explanatory sentence to twenty-five words
    kind: metric
    severity: error
    message: 'This sentence has {value} words. Use twenty-five or fewer.'
    scope: sentence
    text_type: descriptive
    metric: sentence_words
    threshold: 25
    comparison: gt
    tiers:
      strict: enforced
      normal: enforced
      relaxed: enforced
    exceptions:
      - quotation
      - code-span
    allowlist: []
    examples:
      - bad: >-
          The gateway terminates TLS, rewrites the Host header, adds a request identifier for
          tracing, and forwards the request to the service that the routing table names for
          the path prefix.
        good: >-
          The gateway terminates TLS and rewrites the Host header. It adds a request
          identifier for tracing. It then forwards the request to the service that the routing
          table names for the path prefix.
    ai_signal: none
    ai_signal_source: unmeasured
    provenance:
      source: ASD-STE100
      ste_ref: '9:6.3'
      note: >-
        Same word-counting contract as the procedural cap, five words wider. A note inside a
        procedure takes this cap rather than the procedural one, which is why text_type
        classification (see metrics.md) decides which of the two rules applies rather than
        document location.
    fix: Split the sentence at a clause boundary.

  - id: paragraph-too-many-sentences
    name: Keep a paragraph to six sentences
    kind: metric
    severity: warning
    message: 'This paragraph has {value} sentences. Use six or fewer.'
    scope: paragraph
    text_type: descriptive
    metric: paragraph_sentences
    threshold: 6
    comparison: gt
    tiers:
      strict: enforced
      normal: enforced
      relaxed: advisory
    exceptions:
      - quotation
      - code-span
    allowlist: []
    examples:
      - bad: >-
          The gateway terminates TLS. It rewrites the Host header. It adds a request
          identifier. It reads the routing table. It selects a worker. It forwards the
          request. It records the latency.
        good: >-
          The gateway terminates TLS. It rewrites the Host header. It adds a request
          identifier.

          The gateway reads the routing table and selects a worker. It forwards the request
          and records the latency.
    ai_signal: none
    ai_signal_source: unmeasured
    provenance:
      source: ASD-STE100
      ste_ref: '9:6.6'
      note: >-
        This metric uses paragraph_sentences, which is NOT the same sentence unit the word
        caps use. A lead-in plus its vertical list counts as one sentence here, while the
        word-count rules treat each list item as its own sentence. metrics.md states the
        resolution and the evidence for it. Getting this wrong makes almost every bulleted
        block a violation, which is the single largest false-positive risk in the whole set.
    fix: Split the paragraph into two.
