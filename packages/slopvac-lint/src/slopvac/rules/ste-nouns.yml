id: ste-nouns
title: STE Multi-word Nouns
description: Caps the length of noun stacks and requires a short form for longer domain terms.
weight: 1.0
max_per_100_words:
  strict: 0.5
  normal: 1.0
recommended_for: [reference]
rules:
  - id: multiword-noun-too-long
    name: Keep a noun stack to three words
    kind: metric
    severity: warning
    message: 'This noun stack has {value} words. Use three or fewer.'
    scope: sentence
    text_type: any
    metric: multiword_noun_words
    threshold: 3
    comparison: gt
    tiers:
      strict: enforced
      normal: advisory
      relaxed: advisory
    exceptions:
      - identifier-fidelity
      - code-span
      - quotation
      - api-name
      - registered-domain-term
    allowlist: []
    examples:
      - bad: Set the request retry backoff jitter factor in the client config.
        good: Set the jitter factor for retry backoff in the client config.
      - bad: The deployment pipeline artifact retention policy runs each night.
        good: The retention policy for pipeline artifacts runs each night.
    ai_signal: none
    ai_signal_source: unmeasured
    provenance:
      source: ASD-STE100
      ste_ref: '9:2.1'
      note: >-
        Counted in words, not in nouns. A vendor restatement of this rule says "nouns",
        which is wrong against the specification's own worked counts: it labels a
        four-word stack a violation even though one of the four words is an adjective.
        Advisory rather than excluded at relaxed tier because a five-word stack is a real
        comprehension cost, but our detector depends on a tagger and can miscount.
    fix: Break the stack with a preposition, or define a short form.
