id: ste-procedural
title: STE Procedural Writing
description: Governs instruction length, one action per step, imperative mood, condition order, and notes.
weight: 1.2
max_per_100_words:
  strict: 1.0
  normal: 2.0
recommended_for: [reference]
rules:
  - id: sentence-too-long-procedural
    name: Keep an instruction to twenty words
    kind: metric
    severity: error
    message: 'This instruction has {value} words. Use twenty or fewer.'
    scope: sentence
    text_type: procedural
    metric: sentence_words
    threshold: 20
    comparison: gt
    tiers:
      strict: enforced
      normal: enforced
      relaxed: enforced
    exceptions:
      - quotation
      - code-span
    allowlist: []
    examples:
      - bad: >-
          Open the client config, set the retry limit to five, set the backoff to two
          seconds, and then restart every worker in the pool before you run the smoke test.
        good: >-
          Set the retry limit to five and the backoff to two seconds in the client config.
          Restart every worker in the pool. Then run the smoke test.
    ai_signal: none
    ai_signal_source: unmeasured
    provenance:
      source: ASD-STE100
      ste_ref: '9:5.1'
      note: >-
        The twenty-word cap depends entirely on the word-counting contract in metrics.md.
        A whitespace tokenizer over-counts and fires on compliant sentences, which is why
        sentence_words is defined before this rule is implemented. Enforced at every tier,
        including relaxed: a long instruction is the failure mode that costs a reader most.
    fix: Split the instruction into separate numbered steps.

  - id: multiple-instructions-per-sentence
    name: Write one instruction per sentence
    kind: pattern
    severity: warning
    message: 'This step carries more than one instruction ("{match}").'
    scope: sentence
    text_type: procedural
    tiers:
      strict: enforced
      normal: enforced
      relaxed: advisory
    pattern: '^\s*(?:[A-Z][a-z]+)\b[^.:!?]*?,?\s+(?:and\s+then|then|and\s+(?:also\s+)?(?:restart|delete|remove|run|set|open|close|apply|commit|push|deploy|verify|check|update|install|configure|enable|disable|rotate|revoke|copy|move|rename|start|stop))\b'
    ignore_case: false
    exceptions:
      - quotation
      - code-span
      - simultaneous-actions
    allowlist: []
    examples:
      - bad: Delete the stale branch and then push the new tag.
        good: Delete the stale branch. Then push the new tag.
      - bad: Edit the manifest and restart the worker.
        good: Edit the manifest. Restart the worker.
    ai_signal: none
    ai_signal_source: unmeasured
    provenance:
      source: ASD-STE100
      ste_ref: '9:5.2'
      note: >-
        The rule permits two actions in one sentence when they happen at the same time,
        which is the simultaneous-actions exception; a checker cannot detect simultaneity,
        so the exception is reviewer-applied. The pattern anchors on an imperative-initial
        line plus a coordinating connector followed by a second imperative verb from a
        closed list, rather than on "and" alone, which would fire on every coordinated
        object. Tested: both bad examples match; both good examples do not; and "Set the
        retry limit and the backoff in the client config" does not match, because "the" is
        not a verb in the list.
    fix: Split the step so each sentence gives one instruction.

  - id: instruction-not-imperative
    name: Write instructions in the imperative
    kind: pattern
    severity: warning
    message: 'This step is not in the imperative ("{match}").'
    scope: sentence
    text_type: any
    tiers:
      strict: enforced
      normal: enforced
      relaxed: advisory
    pattern: '^\s*(?:(?:The|This|That|A|An)\s+\w+(?:\s+\w+)?\s+(?:must|should|shall|needs?\s+to|has\s+to|is\s+required\s+to|will\s+need\s+to)\b|(?:You|The\s+user|The\s+operator|The\s+reader)\s+(?:must|should|shall|will|can|may)\s+\w+|It\s+is\s+(?:necessary|recommended|required|advisable)\s+to\b)'
    ignore_case: false
    exceptions:
      - quotation
      - code-span
      - note-block
    allowlist: []
    examples:
      - bad: The operator must rotate the signing key each quarter.
        good: Rotate the signing key each quarter.
      - bad: It is necessary to clear the cache before the import.
        good: Clear the cache before the import.
      - bad: The token should be revoked after the audit.
        good: Revoke the token after the audit.
    ai_signal: none
    ai_signal_source: unmeasured
    provenance:
      source: ASD-STE100
      ste_ref: '9:5.3'
      note: >-
        Three alternates covering the three ways a step loses its imperative: a subject plus
        an obligation modal, a reader-as-subject construction, and an impersonal
        "it is necessary to" opener. Deliberately not a general "does the sentence start with
        a verb" test, which needs a tagger and misfires on every legitimate descriptive
        sentence inside a procedure. note-block is excepted because notes are descriptive by
        rule and must not be imperative. Tested: all three bad examples match, all three good
        examples do not, and the descriptive "The worker drains the queue" does not match.
    fix: Rewrite the step as a direct command to the reader.

  - id: condition-after-command
    name: Put the condition before the command
    kind: pattern
    severity: warning
    message: 'The condition follows the command ("{match}"). Put the condition first.'
    scope: body-sentence
    tiers:
      strict: enforced
      normal: advisory
      relaxed: advisory
    pattern: '^\s*(?:(?:(?:For|To|In|On|At|With|Without|During|Using|From|By)\b[^,.!?]{0,80},\s+|(?:Or|Then|Next|First|Second|Third|Finally|Also|Otherwise|Alternatively|Optionally|Now),\s+)(?:[Aa]dd|[Aa]llow|[Aa]pply|[Aa]pprove|[Aa]sk|[Aa]ssume|[Aa]ttach|[Aa]void|[Bb]ack|[Bb]ackup|[Bb]ind|[Bb]uild|[Cc]all|[Cc]ancel|[Cc]hange|[Cc]heck|[Cc]hoose|[Cc]lear|[Cc]lone|[Cc]lose|[Cc]onfigure|[Cc]onfirm|[Cc]onnect|[Cc]onsider|[Cc]opy|[Cc]reate|[Dd]elete|[Dd]eny|[Dd]eploy|[Dd]etach|[Dd]isable|[Dd]isconnect|[Dd]o|[Dd]owngrade|[Dd]rain|[Dd]rop|[Ee]dit|[Ee]nable|[Ee]nsure|[Ee]nter|[Ee]xecute|[Ee]xpect|[Ee]xport|[Ff]ence|[Ff]etch|[Ff]ind|[Ff]ix|[Ff]lush|[Ff]ollow|[Gg]et|[Gg]ive|[Gg]o|[Gg]rant|[Hh]old|[Ii]dentify|[Ii]mport|[Ii]nit|[Ii]nspect|[Ii]nstall|[Ii]nvoke|[Ii]terate|[Kk]eep|[Ll]eave|[Ll]ist|[Ll]oad|[Ll]ock|[Ll]og|[Ll]ogin|[Ll]ogout|[Mm]ake|[Mm]ark|[Mm]atch|[Mm]erge|[Mm]onitor|[Mm]ount|[Mm]ove|[Nn]avigate|[Nn]otify|[Oo]pen|[Oo]verride|[Pp]ass|[Pp]ause|[Pp]erform|[Pp]ick|[Pp]in|[Pp]oint|[Pp]refer|[Pp]repend|[Pp]ress|[Pp]rint|[Pp]romote|[Pp]ull|[Pp]ush|[Pp]ut|[Rr]ead|[Rr]ebuild|[Rr]econcile|[Rr]ecord|[Rr]eject|[Rr]elease|[Rr]eload|[Rr]ely|[Rr]emember|[Rr]emove|[Rr]ename|[Rr]eplace|[Rr]eport|[Rr]erun|[Rr]eset|[Rr]estart|[Rr]esume|[Rr]etry|[Rr]evert|[Rr]eview|[Rr]evoke|[Rr]oll|[Rr]otate|[Rr]un|[Ss]ave|[Ss]chedule|[Ss]elect|[Ss]end|[Ss]et|[Ss]how|[Ss]kip|[Ss]plit|[Ss]tage|[Ss]tart|[Ss]top|[Ss]tore|[Ss]witch|[Tt]ag|[Tt]ake|[Tt]est|[Tt]oggle|[Tt]reat|[Tt]ype|[Uu]nlock|[Uu]nmount|[Uu]nset|[Uu]pdate|[Uu]pgrade|[Uu]se|[Vv]erify|[Ww]ait|[Ww]rap|[Ww]rite)\b(?!-)|(?!(?:If|When|Whenever|Once|Unless|After|Before|While|Until|Because|Since|Although|Though|As|The|A|An|This|That|These|Those|Their|Its|Our|Your|His|Her|My|It|They|We|You|He|She|There|Each|Every|Any|Some|All|Both|No|Many|Most|Such|Other|One|Only|Also|Even|Just|Either|Neither|Not|So|Then|What|Where|Which|Who|How|Why|Whether|Here|Now|For|To|In|On|At|With|Without|During|Using|From|By|Or|And|But)\b)(?:(?:Add|Allow|Apply|Approve|Ask|Assume|Attach|Avoid|Back|Backup|Bind|Build|Call|Cancel|Change|Check|Choose|Clear|Clone|Close|Configure|Confirm|Connect|Consider|Copy|Create|Delete|Deny|Deploy|Detach|Disable|Disconnect|Do|Downgrade|Drain|Drop|Edit|Enable|Ensure|Enter|Execute|Expect|Export|Fence|Fetch|Find|Fix|Flush|Follow|Get|Give|Go|Grant|Hold|Identify|Import|Init|Inspect|Install|Invoke|Iterate|Keep|Leave|List|Load|Lock|Log|Login|Logout|Make|Mark|Match|Merge|Monitor|Mount|Move|Navigate|Notify|Open|Override|Pass|Pause|Perform|Pick|Pin|Point|Prefer|Prepend|Press|Print|Promote|Pull|Push|Put|Read|Rebuild|Reconcile|Record|Reject|Release|Reload|Rely|Remember|Remove|Rename|Replace|Report|Rerun|Reset|Restart|Resume|Retry|Revert|Review|Revoke|Roll|Rotate|Run|Save|Schedule|Select|Send|Set|Show|Skip|Split|Stage|Start|Stop|Store|Switch|Tag|Take|Test|Toggle|Treat|Type|Unlock|Unmount|Unset|Update|Upgrade|Use|Verify|Wait|Wrap|Write)\b(?!-)|(?![A-Z][a-z]*[^e]ed\b)(?![A-Z][a-z]*[^su]s\b)(?!(?!Bring\b)[A-Z][a-z]+ing\b)[A-Z][a-z]+\b(?=\s+(?:the|a|an|your|this|that|each|all|any|it|these|those|its|their|`))(?!-)))[^.!?]*?\s+(if|when|once|unless|after|before|while(?!\s+[a-z]+ing\b))\s+[^.!?]*[.!?]?\s*$'
    ignore_case: false
    exceptions:
      - quotation
      - code-span
    allowlist: []
    examples:
      - bad: Restart the worker if the queue depth is above one thousand.
        good: If the queue depth is above one thousand, restart the worker.
      - bad: Clear the cache when the import completes.
        good: When the import completes, clear the cache.
      - bad: Drain the queue before the worker shuts down.
        good: The worker drains the queue before it shuts down.
      - bad: For headless servers, configure the permissions required by the workload before it starts.
        good: Before the workload starts, configure the permissions it requires on headless servers.
      - bad: Reconcile the ledger when the import completes.
        good: When the import completes, reconcile the ledger.
    ai_signal: none
    ai_signal_source: unmeasured
    provenance:
      source: ASD-STE100
      ste_ref: '9:5.4'
      note: >-
        Issue 9 makes condition-first an obligation and then adds the comma; Issue 7
        regulated only the comma, conditional on the writer's chosen order. A checker built
        from the older wording misses the ordering half, so this rule enforces the ordering
        and comma-after-leading-condition is a separate punctuation rule. Tested: every bad
        example matches, no good example does. Human labelling, 2026-10: every
        sampled finding was a descriptive sentence the procedural classifier let through
        ("The command requires confirmation before removing", "Fixed a crash when
        using") or a manner phrase ("while preserving the meaning"), so the opening word
        must now look like a command -- not a determiner or pronoun, not an -ed, -s, or
        -ing form, not the first half of a hyphenated adjective -- and "while" followed
        by a gerund no longer counts as a condition. Issue 254 (2026-11): headings and
        table cells are skipped (scope body-sentence); the opener must be a known
        command verb, or a capitalised word followed by a determiner or code span, so a
        noun-phrase subject ("Action reviews offer") no longer counts; a For/To/In
        lead-in or an Or/Then/First connective is stripped before that test; and a
        sentence that starts with its condition never matches. The rule no longer declares
        text_type: Vale ignores it, and the opener test above replaces the closed-list
        classifier, so Vale and the native engine now agree.
    fix: Move the condition clause to the front and follow it with a comma.

  - id: note-gives-instruction
    name: Keep notes free of instructions
    kind: pattern
    severity: warning
    message: 'This note gives an instruction ("{match}"). A note only gives information.'
    scope: paragraph
    text_type: descriptive
    tiers:
      strict: enforced
      normal: enforced
      relaxed: enforced
    pattern: '^\s*(?:>\s*)?(?:\*\*)?(?:NOTE|Note)(?:\*\*)?\s*[:.]?\s*(?:Do\s+not\b|Always\b|Never\b|Make\s+sure\b|Be\s+sure\b|Remember\s+to\b|You\s+must\b|Ensure\b|Set\b|Run\b|Restart\b|Delete\b|Install\b|Configure\b|Verify\b|Check\b)'
    ignore_case: false
    exceptions:
      - quotation
      - code-span
    allowlist: []
    examples:
      - bad: 'NOTE: Always clear the cache before you run the import.'
        good: >-
          Clear the cache before you run the import. NOTE: The import reads the cache at
          startup.
      - bad: 'NOTE: Do not run two imports at the same time.'
        good: >-
          Do not run two imports at the same time. NOTE: Two imports write to the same
          table.
    ai_signal: none
    ai_signal_source: unmeasured
    provenance:
      source: ASD-STE100
      ste_ref: '9:5.5'
      note: >-
        A note that carries an instruction is a real defect and not a style point: readers
        skip notes, so the instruction is lost. Enforced at every tier for that reason. The
        pattern anchors on a note marker followed by an imperative or obligation opener, and
        tolerates Markdown emphasis and blockquote markers. Tested: both bad examples match,
        both good examples do not (the imperative sits before the marker), and
        "NOTE: The import reads the cache at startup" does not match.
    fix: Move the instruction into a numbered step and leave only information in the note.
