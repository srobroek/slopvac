id: prose-discipline
title: Prose discipline
description: Referential consistency, sentence load, and constructions that hide the verb or the claim.
weight: 1.5
recommended_for: [readme, guide, reference, api-docs, runbook, adr]
max_per_100_words:
  strict: 0.4
  normal: 0.8
  relaxed: 2.0
rules:
  # --- Synonym rotation -----------------------------------------------------
  # Mechanically this can only detect that two competing terms BOTH appear; it
  # cannot tell a deliberate distinction ("the user authenticates, the client
  # retries") from careless rotation. So the pattern rule reports co-occurrence
  # and the judgement rule decides.
  - id: competing-actor-terms
    name: Pick one term for one subject
    kind: judgement
    message: >-
      Two or more terms name what may be the same subject. Pick one and use it
      everywhere, or state the distinction at first use.
    scope: document
    tiers:
      strict: enforced
      normal: enforced
      relaxed: advisory
    judgement_question: >-
      List every term this document uses for a person or system that acts:
      user, customer, client, consumer, caller, requester, tenant, account,
      operator, admin, developer, integrator, subscriber, end user. For each
      pair, do they name the same subject? If yes, that is rotation and one term
      must win. If no, does the document define the difference at first use?
    exceptions:
      - defined-distinction
      - quotation
      - api-name
      - glossary-entry
    examples:
      - bad: >-
          The user submits a job. The customer receives a token. The client then
          polls for the result.
        good: >-
          The user submits a job, receives a token, and polls for the result.
        note: >-
          Three terms, one actor. The fix is one term, not three synonyms.
      - bad: >-
          The caller opens a connection. The consumer must close it.
        good: >-
          The caller opens the connection and must close it.
    provenance:
      source: ASD-STE100
      ste_ref: '9:1.11'
      note: >-
        The specification requires one name for one thing. Software prose breaks
        this most often across actor nouns, because each one reads as a
        legitimate synonym in isolation. Kept as judgement because
        co-occurrence alone does not prove rotation: a document may
        legitimately distinguish a user from the client library that acts for
        them.
    fix: >-
      Choose the narrowest accurate term, replace every other, and define the
      distinction at first use only when two subjects genuinely differ.

  - id: term-rotation-signal
    name: Competing actor terms appear together
    kind: pattern
    severity: suggestion
    message: >-
      "{match}" appears alongside another actor term in this document. Confirm
      they name different subjects.
    scope: prose
    tiers:
      strict: advisory
      normal: advisory
      relaxed: excluded
    # Advisory only, and deliberately so. This fires on the presence of a term,
    # not on a proven defect, so it is a prompt to check rather than a finding to
    # fix. Its value is pointing the reviewer at the judgement rule above.
    pattern: '(?<![\w-])(?:end[- ]users?|customers?|consumers?|requesters?|subscribers?)(?![\w-])'
    ignore_case: true
    exceptions:
      - defined-distinction
      - quotation
      - api-name
      - glossary-entry
    examples:
      - bad: The customer receives a token.
        good: The user receives a token.
    provenance:
      source: ASD-STE100
      ste_ref: '9:1.11'
      note: >-
        Paired with competing-actor-terms, which carries the judgement. This
        half only surfaces the candidate terms; it cannot know which is correct
        for the document.
    fix: Use the document's one chosen actor term.

  # --- Frozen verbs ---------------------------------------------------------
  # Overlaps the passive-voice rule at the surface but is a different defect: the
  # action has been turned into a noun and bolted onto a general-purpose verb.
  # "An analysis was performed" is both; "we perform an analysis" is only this.
  - id: frozen-verb
    name: Put the action in the verb
    kind: pattern
    severity: error
    message: >-
      "{match}" freezes the action in a noun. Use the plain verb.
    scope: prose
    tiers:
      strict: enforced
      normal: enforced
      relaxed: advisory
    # A general-purpose verb followed by an optional article and a nominalized
    # action noun. The suffix list is what makes this precise: without it the
    # pattern fires on every "make a copy" and "take a branch".
    pattern: '(?<![\w-])(?:perform|conduct|carry out|undertake|execute|make|do|give|provide|effect|achieve|obtain|initiate|facilitate|implement)(?:s|ed|ing)?\s+(?:a|an|the)?\s*\w{4,}(?:tion|sion|ment|ance|ence|ysis|ision|ation)(?![\w-])'
    ignore_case: true
    exceptions:
      - identifier-fidelity
      - quotation
      - code-span
      - legal-force
      - api-name
    allowlist:
      - make a decision about
      - implementation
    examples:
      - bad: The runner performs an analysis of the coverage report.
        good: The runner analyzes the coverage report.
      - bad: Conduct an investigation of the failing shard.
        good: Investigate the failing shard.
      - bad: The hook provides validation of the payload.
        good: The hook validates the payload.
    provenance:
      source: ASD-STE100
      ste_ref: '9:3.7'
      orwell_ref: cut-what-cuts
      note: >-
        Both sources name this. Orwell's operators-or-verbal-false-limbs
        paragraph calls the pattern "the elimination of simple verbs"; the
        specification requires a verb for an action. Overlaps
        orwell-voice.passive-voice on sentences that are both passive and
        frozen, which is correct: they carry two defects and the fix differs.
    fix: >-
      Promote the noun to a finite verb and delete the general-purpose verb and
      its article.

  # --- Run-on sentences -----------------------------------------------------
  # Distinct from the word-count cap: a 24-word sentence can be four ideas and a
  # 30-word one can be a single clean list. This counts CLAUSE BOUNDARIES, which
  # is what a reader actually pays for.
  - id: run-on
    name: Split the run-on
    kind: metric
    severity: warning
    message: >-
      This sentence stitches {match} independent ideas together; the limit is
      {replacement}. Split it.
    scope: sentence
    metric: clause_boundaries
    threshold: 3
    comparison: gt
    tiers:
      strict: enforced
      normal: enforced
      relaxed: advisory
    exceptions:
      - quotation
      - code-span
      - vertical-list
      - legal-force
    examples:
      - bad: >-
          The parser reads the file, and it normalizes the paths; then it emits
          the report, but it skips any entry that fails validation, which the
          caller must handle separately.
        good: >-
          The parser reads the file and normalizes the paths. It emits the
          report and skips any entry that fails validation. The caller handles
          those separately.
    provenance:
      source: ASD-STE100
      ste_ref: '9:4.1'
      note: >-
        Counts coordinating conjunctions, semicolons, dashes used as clause
        joins, and non-restrictive "which" clauses, rather than words. A
        sentence under the word cap can still carry four ideas, and that is the
        defect a reader feels. Threshold 3 permits a compound sentence with a
        trailing qualifier and rejects the fourth stitch.
    fix: Split at the clause boundary that carries the least shared context.

  # --- Phrasal verbs --------------------------------------------------------
  # A closed list of the ones that are pure register, each with the plain verb.
  # Deliberately NOT a general -up/-out/-into pattern: "set up", "log in", and
  # "check out" are the correct names of real operations, and a general pattern
  # would fire on all of them.
  - id: phrasal-verb
    name: Use the plain verb
    kind: substitution
    severity: warning
    message: 'Use "{replacement}" rather than "{match}".'
    scope: prose
    tiers:
      strict: enforced
      normal: enforced
      relaxed: advisory
    substitutions:
      '\bspin(?:s|ning)? up\b': start
      '\bspun up\b': started
      '\bspin(?:s|ning)? down\b': stop
      '\bstand(?:s|ing)? up\b': deploy
      '\bstood up\b': deployed
      '\breach(?:es|ing)? out\b': ask
      '\breached out\b': asked
      '\bdive(?:s|d)? into\b': examine
      '\bdiving into\b': examining
      '\bdig(?:s|ging)? into\b': examine
      '\bkick(?:s|ing)? off\b': start
      '\bkicked off\b': started
      '\bcircle back\b': return to this
      '\bcircling back\b': returning to this
      '\bdrill(?:s|ing)? down\b': examine in detail
      '\bramp(?:s|ing)? up\b': increase
      '\bramped up\b': increased
      '\bsurface(?:s|d)? up\b': report
      '\bbubble(?:s|d)? up\b': propagate
      '\bloop(?:s|ing)? in\b': include
      '\blooped in\b': included
      '\btouch base\b': speak
      '\bdouble(?:s|d)? down on\b': commit to
      '\bunpack(?:s|ing)?\b': explain
      '\blean(?:s|ing)? into\b': prioritize
      '\blevel(?:s|ling|ing)? up\b': improve
      '\bwind(?:s|ing)? down\b': stop
      '\bsun ?set(?:s|ting)?\b': withdraw
    ignore_case: true
    exceptions:
      - identifier-fidelity
      - quotation
      - code-span
      - api-name
      - ui-label
    allowlist:
      - set up
      - sets up
      - setup
      - log in
      - logs in
      - login
      - check out
      - checks out
      - checkout
      - roll back
      - rolls back
      - rollback
      - fall back
      - falls back
      - fallback
      - back up
      - backs up
      - backup
      - clean up
      - cleans up
      - cleanup
      - shut down
      - shuts down
      - shutdown
      - opt in
      - opts in
      - opt out
      - build up
      - tear down
      - teardown
    examples:
      - bad: Spin up a replica before you migrate.
        good: Start a replica before you migrate.
      - bad: We reached out to the maintainers.
        good: We asked the maintainers.
      - bad: This section unpacks the retry logic.
        good: This section explains the retry logic.
    provenance:
      source: ASD-STE100
      ste_ref: '9:3.5'
      note: >-
        A closed list, not a general -up/-out pattern. `set up`, `log in`,
        `check out`, `roll back`, and `shut down` are the correct names of real
        operations, and a suffix pattern would report every one of them. The
        allowlist is the load-bearing half of this rule.
    fix: Replace with the plain verb the list names.

  # --- Marketing register ---------------------------------------------------
  # The mechanical half is a token list. The judgement half is what the tokens
  # cannot reach: a document with no banned adjective can still be marketing
  # copy, because the register lives in the claim shape, not the word.
  - id: marketing-register
    name: Describe, do not sell
    kind: judgement
    message: >-
      This passage sells rather than describes. State what the artifact does and
      what a reader can measure.
    scope: paragraph
    tiers:
      strict: enforced
      normal: enforced
      relaxed: advisory
    judgement_question: >-
      For each evaluative claim in this passage, is there a number, a benchmark,
      a named limit, a version, or a citation within the same sentence or the
      next one? And would the claim's opposite be recognized as a disagreement
      about fact rather than a difference of opinion? A claim that fails both is
      marketing.
    exceptions:
      - quantified
      - quotation
      - defined-term-of-art
      - landing-page
    examples:
      - bad: >-
          Built for teams who care about quality, our approach gives you
          confidence at every step of the pipeline.
        good: >-
          The gate blocks a merge when coverage drops below 80%.
        note: >-
          No banned adjective appears in the first version. The defect is the
          claim shape: nothing in it can be checked.
      - bad: Designed from the ground up for the modern developer workflow.
        good: Runs as a pre-commit hook and a GitHub Action.
    provenance:
      source: Orwell 1946
      orwell_ref: empty-evaluative-word
      note: >-
        Paired with orwell.unsupported-evaluative, which owns the token list.
        This half exists because the token list is perishable and incomplete: a
        passage can carry the marketing register with no listed word in it, and
        that is the commoner failure in generated prose.
    fix: >-
      Replace each unmeasurable claim with the fact that motivated it, or delete
      the sentence.

  - id: marketing-lexicon
    name: Cut the marketing adjective
    kind: tokens
    severity: warning
    message: '"{match}" is sales register. State the measurable fact instead.'
    scope: prose
    tiers:
      strict: enforced
      normal: enforced
      relaxed: advisory
    # Kept separate from orwell.unsupported-evaluative: that rule holds the
    # words that evaluate WITHOUT evidence, these are the words that belong to
    # advertising whatever evidence exists. `blazing fast` with a benchmark is
    # still the wrong register for reference material.
    tokens:
      - effortless
      - effortlessly
      - turnkey
      - best-in-class
      - game-changing
      - revolutionary
      - next-generation
      - supercharge
      - supercharged
      - unleash
      - unleashes
      - empower
      - empowers
      - delightful
      - magical
      - beautifully
      - stunning
      - unparalleled
      - unmatched
      - premier
      - first-class
      - top-tier
      - hassle-free
      - pain-free
      - zero-effort
      - future-proof
      - bulletproof
      - rock-solid
      - blazing
      - buttery smooth
      - dead simple
      - insanely fast
      - ridiculously easy
    ignore_case: true
    exceptions:
      - quotation
      - identifier-fidelity
      - landing-page
      - api-name
    examples:
      - bad: A turnkey, future-proof deployment story.
        good: Deploys with one command; supported on Kubernetes 1.28 and later.
    provenance:
      source: prose-inflation
      note: >-
        Distinct from orwell.unsupported-evaluative by test rather than by
        taste: that rule asks whether evidence is present, this one asks whether
        the word belongs to advertising at all. `bulletproof` fails even with a
        benchmark beside it.
    fix: Delete the adjective and state what the reader can measure.

  # --- Run-on, judgement half -----------------------------------------------
  # Clause counting is a proxy, not the defect. A sentence can carry four clauses
  # and read cleanly when they share a subject and run in sequence, and it can
  # carry two and be unreadable when they hold unrelated ideas. Only a reader
  # decides which, so the metric finds candidates and this decides.
  - id: overloaded-sentence
    name: One sentence, one idea
    kind: judgement
    message: >-
      This sentence carries more than one idea. Split it at the point where the
      reader has to start holding something new.
    scope: sentence
    tiers:
      strict: enforced
      normal: enforced
      relaxed: advisory
    judgement_question: >-
      Read the sentence once and stop. How many separate things must the reader
      now remember? If more than one, could each stand as its own sentence
      without repeating a noun phrase to make sense? If yes, it is overloaded.
      A list of parallel actions sharing one subject and one verb is ONE idea,
      however long; two clauses joined by "and" that could each stand alone are
      two.
    exceptions:
      - quotation
      - code-span
      - vertical-list
      - legal-force
      - parallel-list
    examples:
      - bad: >-
          The parser reads the manifest and the resolver walks the dependency
          graph.
        good: >-
          The parser reads the manifest. The resolver then walks the dependency
          graph.
        note: >-
          Two clauses, two subjects, two ideas. Each stands alone.
      - bad: >-
          Because the cache is keyed by content the migration must run first,
          and the index rebuild depends on it, so plan for downtime.
        good: >-
          The cache is keyed by content, so the migration must run first. The
          index rebuild depends on the migration. Plan for downtime.
      - bad: We deleted the retry path, which nobody used, and simplified the client.
        good: Nobody used the retry path, so we deleted it. That simplified the client.
        note: >-
          The metric counts two boundaries here and would pass at threshold 3.
          A reader still holds three things.
    provenance:
      source: ASD-STE100
      ste_ref: '9:4.1'
      note: >-
        Paired with prose-discipline.run-on, which counts clause boundaries. The
        count is a candidate finder: it cannot tell a parallel list sharing one
        subject from two unrelated clauses, and both shapes appear at the same
        boundary count. This half carries the decision.
    fix: >-
      Split at the boundary where the reader starts holding a second thing, and
      make the shared noun explicit in the new sentence.

  # --- Hedging: the document-level failure ----------------------------------
  # The existing rules catch a stack inside one sentence
  # (prose-inflation.hedge-stack) and an invented counter-claim
  # (ai-tells-register.hedged-symmetry). Neither sees a document that hedges
  # every claim it makes and therefore asserts nothing.
  - id: hedged-into-uselessness
    name: The document must assert something
    kind: judgement
    message: >-
      This document hedges its own claims to the point of asserting nothing. Take
      the position the evidence supports.
    scope: document
    tiers:
      strict: enforced
      normal: enforced
      relaxed: advisory
    judgement_question: >-
      List the load-bearing claims: the sentences a reader would act on. For each,
      is it hedged? Then ask three things. First, could the reader act on the
      document as written, or does every path out of it end in "it depends"?
      Second, is any claim hedged in BOTH directions, so that the hedge and its
      counter-hedge cancel ("this may improve latency, though it might also
      increase it")? Third, is any hedge itself hedged ("this could potentially
      help in some cases")? A document where the majority of load-bearing claims
      carry a hedge is a document that says nothing, whatever each sentence
      looks like on its own.
    exceptions:
      - genuine-uncertainty
      - quotation
      - legal-force
      - safety-critical
      - measured-variance
    examples:
      - bad: >-
          The cache may improve response time in some workloads, though results
          can vary and it might increase memory use depending on configuration.
        good: >-
          The cache cuts median response time by 40% on repeated prompts. It
          holds entries in memory: budget 200 MB per 10,000 entries.
        note: >-
          Hedged in both directions, so the two halves cancel and the reader
          learns nothing they can act on.
      - bad: >-
          You should probably consider using the strict profile for reference
          material, although the normal profile may also be suitable in many
          cases.
        good: Use the strict profile for reference material.
      - bad: This could potentially help reduce some of the noise in certain cases.
        good: This removes the 12 findings that fired on code comments.
        note: A hedge on a hedge on a quantifier. Three layers, no claim.
    provenance:
      source: Orwell 1946
      orwell_ref: cut-what-cuts
      note: >-
        Document-scoped on purpose. Every sentence here can pass
        prose-inflation.hedge-stack, which fires only on a stack inside one
        sentence. The defect is the ratio across the document: a single honest
        hedge is correct, and hedging every claim is a refusal to write the doc.
        A hedge is permitted where the uncertainty is real and named -- a
        measured variance, a documented platform difference -- and the exception
        list is what a suppression must cite.
    fix: >-
      For each hedged claim, either state it plainly with the evidence, or delete
      it. Where the uncertainty is real, name its cause and its bound instead of
      hedging the verb.

  - id: bidirectional-hedge
    name: Do not hedge both ways
    kind: pattern
    severity: warning
    message: >-
      "{match}" hedges in both directions, so the two halves cancel. State which
      one the evidence supports.
    scope: sentence
    tiers:
      strict: enforced
      normal: enforced
      relaxed: advisory
    # A hedged claim followed by a hedged counter-claim in the same sentence. This
    # is the mechanizable core of hedged-into-uselessness: the shape is visible
    # even when the ratio across the document is not.
    pattern: '(?:may|might|could|can|should|tends? to|is likely to)\s+\w+[^.!?]{0,80}?(?:,\s*)?(?:but|though|although|however|while|whereas|yet)\s+[^.!?]{0,40}?(?:may|might|could|can|also|equally|sometimes)\b'
    ignore_case: true
    exceptions:
      - genuine-uncertainty
      - measured-variance
      - quotation
      - legal-force
      - safety-critical
    examples:
      - bad: >-
          The cache may improve response time, though it might also increase
          memory use.
        good: >-
          The cache cuts median response time by 40% and holds 200 MB per 10,000
          entries.
      - bad: Batching can reduce cost, but it may equally add latency.
        good: Batching cuts cost by 30% and adds 15 ms of latency.
    provenance:
      source: Orwell 1946
      orwell_ref: cut-what-cuts
      note: >-
        The mechanizable core of hedged-into-uselessness. Reports the shape; the
        judgement rule decides whether the uncertainty behind it is real.
    fix: >-
      Keep the direction the evidence supports and state its magnitude. Where both
      hold, give both numbers rather than both hedges.

  - id: hedged-hedge
    name: One hedge or none
    kind: pattern
    severity: warning
    message: >-
      "{match}" hedges a hedge. Keep at most one, or state the claim plainly.
    scope: prose
    tiers:
      strict: enforced
      normal: enforced
      relaxed: advisory
    # Distinct from prose-inflation.hedge-stack, which matches a modal followed by
    # an adverb. This catches a hedge wrapped around a VAGUE QUANTIFIER, which is
    # the commoner generated shape: "help reduce some of", "in certain cases".
    pattern: '(?<![\w-])(?:may|might|could|can|should|would)\s+(?:\w+\s+)?(?:help(?:s)?\s+(?:to\s+)?|serve\s+to\s+|work\s+to\s+|tend\s+to\s+)?\w+\s+(?:some|certain|various|several|many|most)\s+(?:of\s+)?(?:the\s+)?\w+|(?<![\w-])in\s+(?:some|certain|many|most)\s+cases?(?![\w-])'
    ignore_case: true
    exceptions:
      - genuine-uncertainty
      - measured-variance
      - quotation
      - legal-force
    examples:
      - bad: This could potentially help reduce some of the noise in certain cases.
        good: This removes the 12 findings that fired on code comments.
      - bad: The flag may help avoid certain failures.
        good: The flag skips the retry path, so a 429 fails immediately.
    provenance:
      source: Orwell 1946
      orwell_ref: cut-what-cuts
      note: >-
        Separate from prose-inflation.hedge-stack: that rule matches modal plus
        adverb ("may possibly"), this one matches a modal wrapped around a vague
        quantifier ("may help reduce some of the"), which no adverb appears in.
    fix: >-
      Delete the hedging verbs and the quantifier, then name what actually
      changes.

  # --- Bare quantifiers: the class no pattern can reach ----------------------
  # `most`, `some`, `many`, `often`, and `usually` are the commonest evasion in
  # generated prose AND ordinary correct English. Wikipedia's own qualifier is the
  # test -- "quantifiers such as many, WHEN QUANTIFIABLE MEASURES COULD BE
  # PROVIDED" -- and whether the figure was available is not in the text. So this
  # is judgement, and the token list stays out of the lexical rules.
  - id: bare-quantifier-with-figure-available
    name: Give the bare quantifier its number
    kind: judgement
    message: >-
      A bare quantifier stands where a figure was available. Give the number.
    scope: document
    tiers:
      strict: enforced
      normal: enforced
      relaxed: advisory
    judgement_question: >-
      Find every bare quantifier: most, some, many, few, often, usually,
      frequently, generally, typically, several times, much, little. For each,
      ask one question -- does the writer have the number? A quantifier over
      something the document itself counts elsewhere, over a list it contains,
      or over a measurement it reports is a withheld figure and must be
      replaced. A quantifier over a genuinely unbounded or unmeasured set is
      correct and stays.
    exceptions:
      - genuinely-unmeasured
      - quotation
      - unbounded-set
      - idiom
      - defined-elsewhere
    examples:
      - bad: Most requests are cached.
        good: 94% of requests are cached.
        note: >-
          The document reports the hit rate two paragraphs later, so the figure
          was available.
      - bad: The parser handles many formats.
        good: The parser handles XISF, FITS, and TIFF.
        note: A list the document could have written out.
      - bad: Some tests need a live database.
        good: The four integration tests need a live database.
      - bad: Most requests complete in 15 ms.
        good: Most requests complete in 15 ms.
        note: >-
          CORRECT AS WRITTEN, and the reason this is judgement rather than a
          token list. The figure is present; `most` quantifies the distribution
          honestly, because not all of them do.
    provenance:
      source: Wikipedia MOS:WEASEL
      note: >-
        Deliberately NOT a lexical rule. Wikipedia lists these tokens, and its own
        condition is "when quantifiable measures could be provided", which no
        pattern decides: "most requests complete in 15 ms" is correct and "most
        users prefer it" is not, and the two are identical in shape. A token rule
        here would fire on correct prose in every document, which is how a rule
        gets disabled. The multi-word forms that carry the evasion in their
        shape -- "a number of", "in most cases" -- ARE mechanized, in
        prose-inflation.vague-quantifier.
    fix: >-
      Replace the quantifier with the figure. Where the set is genuinely
      unmeasured, say so and name why.
