id: docs-discipline
title: Docs discipline
description: >-
  Deterministic consumer-document rules: describe the released artifact at HEAD,
  with no status claims, delta narration, or internal references. Change
  communications, migrations, decision records, plans/specs, and historical reports
  are routed to their own genres rather than judged by these consumer-doc rules.
weight: 1.0
recommended_for: [consumer]
rules:
  - id: status-language
    exceptions: [quotation]
    name: State what the artifact does at HEAD
    kind: pattern
    severity: error
    message: 'status language: {match} -- state what the artifact does at HEAD'
    scope: prose
    tiers:
      strict: enforced
      normal: enforced
      relaxed: advisory
    pattern: '\b(under construction|work[- ]in[- ]progress|WIP|coming soon|Draft(?!\s+(?-i:a|an|the|your)\b)|being (specified|designed|implemented|built)|not yet (implemented|supported|available)|will (eventually|later|soon)\b|to be (implemented|defined|determined)|TBD|TODO|for now|at the moment|currently(?! (running|active|open|connected|executing|loaded|mounted))|as of (now|writing|today)|planned( for)?|on the roadmap|in (a )?future (release|version)|stay tuned)\b'
    ignore_case: true
    match_all_caps: true
    fix: Delete the passage, or state the behaviour the code has now.
    examples:
      - bad: The globbing flag is coming soon.
        good: The flag accepts a literal path.
      - bad: Support for MDX is not yet implemented.
        good: The parser reads Markdown.
      - bad: This page is a draft that the team still edits.
        good: "Open match: draft a comment on it with the new evidence."
      - bad: The API is in draft.
        good: The API accepts requests.
    ai_signal: none
    ai_signal_source: unmeasured
    provenance:
      source: Retired Vale style — docs-discipline/StatusLanguage.yml
      url: https://github.com/srobroek/slopvac/blob/29d6a802562e6454bc2131e8ac7eb24eab72c1bf/packages/slopvac-lint/vale-styles/docs-discipline/StatusLanguage.yml
      note: >-
        E1 in the retired slop-lint.py. The negative lookahead on `currently`
        exempts runtime-state description (currently running/active/...), which is
        legitimate present tense, not doc status. Relaxed is advisory rather than
        excluded because a false status claim is a factual defect, not a register
        preference. .vale.ini turns it off for the package's own normative source
        files, which quote the ban list they enforce.
        Go->Python: the lookahead `(?!...)` is RE2-safe and ports unchanged.
        `Draft` excludes a following lowercase `a`, `an`, `the`, or `your`, so the
        imperative verb in `draft a comment` is not status language. The exclusion is
        case-sensitive, so a `Draft` label that ends a line before a new sentence still
        matches. Noun uses such as `a draft`, `in draft`, and `a draft that ...` match.

  - id: history-narration
    exceptions: [quotation, versioned-change-note]
    name: Keep deltas out of a doc body
    kind: pattern
    severity: error
    message: 'history narration: {match} -- deltas belong in change comms, not a doc body'
    scope: prose
    tiers:
      strict: enforced
      normal: enforced
      relaxed: excluded
    pattern: '\b(previously|formerly|used to (be|do|have)|has been (refactored|migrated|renamed|rewritten)|was (refactored|migrated|renamed|rewritten|extracted)|renamed from|moved (over )?from|we (dropped|removed|changed|switched|migrated)|instead of the old)\b'
    ignore_case: true
    fix: Delete the delta; a changelog or release note carries it.
    examples:
      - bad: The loader was previously named the resolver.
        good: The loader resolves paths.
    ai_signal: none
    ai_signal_source: unmeasured
    provenance:
      source: Retired Vale style — docs-discipline/HistoryNarration.yml
      url: https://github.com/srobroek/slopvac/blob/29d6a802562e6454bc2131e8ac7eb24eab72c1bf/packages/slopvac-lint/vale-styles/docs-discipline/HistoryNarration.yml
      note: >-
        E4 in the retired slop-lint.py. Excluded at relaxed because it encodes a
        genre assumption: a changelog, release note, or migration guide exists to
        narrate the delta, so the rule is wrong for the change-comms genre by
        construction.

  - id: no-longer-change
    exceptions: [quotation, versioned-change-note]
    name: Keep "no longer" change claims out of a doc body
    kind: pattern
    severity: error
    message: 'history narration: {match} -- state what the artifact does now; the delta belongs in change comms'
    scope: prose
    tiers:
      strict: enforced
      normal: enforced
      relaxed: excluded
    pattern: '\b(no longer (?:supports?|supporting|requires?|requiring|accepts?|accepting|ships?|shipping|includes?|including|provides?|providing|uses?|using|needs?|needing|works?|working|resolves?|resolving|prints?|printing|loads?|loading|reads?|reading|writes?|writing|sends?|sending|creates?|creating|returns?|returning|applies|apply|applying|(?:is|are) (?:available|required))|(?:is|are) no longer (?:available|required|(?:supporting|requiring|accepting|shipping|including|providing|using|needing|working|resolving|printing|loading|reading|writing|sending|creating|returning|applying)))\b'
    ignore_case: true
    fix: State the current behaviour; a changelog or release note carries the delta.
    examples:
      - bad: The loader no longer resolves paths.
        good: The loader resolves paths.
      - bad: The flag is no longer required.
        good: The flag is optional.
      - bad: The importer no longer reads the cache.
        good: Stop polling when the run is no longer live.
        note: "the good text is runtime state, not a change claim"
    ai_signal: none
    ai_signal_source: unmeasured
    provenance:
      source: Split from docs-discipline.history-narration (issue 255)
      url: https://github.com/srobroek/slopvac/issues/255
      note: >-
        "no longer" before a change verb narrates a delta. In the prototype run
        81 of 83 uses described runtime state ("the run is no longer live"), so
        the phrase alone no longer fires; only a following change verb does.
        Excluded at relaxed for the same genre reason as history-narration.

  - id: internal-refs
    exceptions: [quotation]
    name: Keep internal references out of consumer docs
    kind: pattern
    severity: error
    message: 'internal reference: {match} -- consumer docs describe the released artifact only'
    scope: prose
    tiers:
      strict: enforced
      normal: enforced
      relaxed: excluded
    pattern: '(\bspecs?/|\.specify/|\bADRs?\b|\bADR[- ]?\d+|\bconstitution\b|\bdesign doc(ument)?\b|per the spec\b|as specified in\b|extracted from\b|mirrors (the )?\w+ (package|repo)|aligned with\b)'
    ignore_case: true
    fix: State the behaviour; drop the pointer to internal process.
    examples:
      - bad: The threshold is set per the spec in specs/004.
        good: The threshold is 34 words.
    ai_signal: none
    ai_signal_source: unmeasured
    provenance:
      source: Retired Vale style — docs-discipline/InternalRefs.yml
      url: https://github.com/srobroek/slopvac/blob/29d6a802562e6454bc2131e8ac7eb24eab72c1bf/packages/slopvac-lint/vale-styles/docs-discipline/InternalRefs.yml
      note: >-
        E3 in the retired slop-lint.py, and a CONSUMER-genre rule only, so
        excluded at relaxed. Scope is deliberately prose and not raw: the original
        scanned whole lines so a spec path inside a link target was caught, but
        measured on the source corpus that cost 5 false positives per README
        (`--no-constitution` in a command example, `.specify/` in a code span)
        against one real prose hit. Link targets are validated by lychee in CI.
        .vale.ini disables it for specs/, .specify/, ADR paths, CONTRIBUTING,
        constitution, and the two package READMEs that document the rule itself.

