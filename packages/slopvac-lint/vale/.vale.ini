# Vale sub-gate for slopvac.
#
# Vale runs ONE style here: the upstream tbhb/vale-ai-tells package, 76 rules we
# do not fork. Every style this repo authored is converted to a native
# slopvac rule, so listing it here as well would report each finding twice.
#
# Vale is still worth keeping for two things it does that the native engine does
# not: it is syntax-aware for source files, linting comments and docstrings while
# skipping identifiers and string literals, and it tracks an upstream ruleset we
# get for free.
#
# Three syntax traps, all silent when wrong:
#   - `|` alternation in a section header matches NOTHING. Use `{a,b}`.
#   - `Style.* = <level>` does not demote a whole style; each rule needs a line.
#   - An extension with no Vale parser and no `[formats]` alias lints as NOTHING
#     and exits 0. Any extension added below needs a fixture proving it fires.

StylesPath = styles
MinAlertLevel = warning

Packages = https://github.com/tbhb/vale-ai-tells/releases/latest/download/ai-tells.zip

# `.mdx` has no parser: without this alias Vale hard-fails with "mdx2vast not
# found". Do NOT alias tsx/jsx -- `tsx = html` errors and `tsx = md` reports zero
# findings silently, and an alias also defeats the comment scoping below.
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = ai-tells

# --- Measured exclusions ------------------------------------------------------
# ai-tells ships 75 of its 76 rules at error. Each line below is a measurement
# against a software-documentation corpus, not taste. Re-enable one only after
# checking it against your own corpus.

# ~190 tokens of the 2023-to-mid-2024 lexical era band, which the next model
# generation was patched out of, plus words with ordinary technical uses
# (comprehensive, granular, scalable). slopvac's prose-inflation.slop-lexicon
# is the maintained ban list.
ai-tells.OverusedVocabulary = NO

# Flags implement / implementation / framework. Correct words in this corpus.
ai-tells.FormalRegister = NO

# One idiom per rule file, and startup-as-organism metaphors. Neither earns a gate.
ai-tells.RedundantPrecaution = NO
ai-tells.GrowthMetaphors = NO

# Its token list includes the literal `--`, this repo's sanctioned dash form:
# 6,743 uses against 2,124 real Unicode dashes, so it fired ~40 times per document
# on our own convention. prose-format.no-unicode-dash bans only U+2014/U+2013.
ai-tells.EmDashUsage = NO

# Ordinary English connectives at error: specifically, likewise, therefore,
# additionally. The rule encodes a preference for shorter connectors.
ai-tells.FormalTransitions = NO

# Punctuation-frequency opinions rather than AI tells. Measured on 488 tracked
# *.md: SemicolonUsage fired 612 times and ColonUsage 128, all on correct
# punctuation -- a semicolon joining two independent clauses, a colon before a
# proper noun.
ai-tells.SemicolonUsage = NO
ai-tells.ColonUsage = NO

# 149 hits, and the rule cannot tell a rhetorical tricolon from a three-item
# technical enumeration ("create, update, and delete").
ai-tells.VerbTricolon = warning

# Domain vocabulary here, not a tell: 53 hits, all the literal verb.
ai-tells.ShipOveruse = NO

# Their own rule comments concede these are over-broad.
ai-tells.MicDrop = warning
ai-tells.ParallelStaccato = warning

# The same dead era band as OverusedVocabulary, scored as compound pairs. Demoted
# rather than disabled: the compound form is a stronger signal than the bare
# adjective.
ai-tells.AICompoundPhrases = warning

# --- Source files: comments and docstrings ------------------------------------
# Vale is syntax-aware here with no alias and no extractor: it lints comments and
# docstrings and skips identifiers and string literals, so a field named `robust`
# stays clean while the doc comment above it does not. This is the capability the
# native engine does not have, and the reason Vale stays in the pipeline.
#
# An allowlist, not the full set. Measured on 55 files: the full set produced 214
# findings, almost all false, because code-comment register is terse and
# legitimately negative ("No PCRE, no \b" trips ContrastiveNegation). The list
# below produced 8. Every rule here matches a defect in any register.
[*.{go,rs,py,ts,js,mjs,cjs,tsx,jsx,java,rb,c,h,cpp,cs,swift,kt,php,sh,bash,lua}]
BasedOnStyles =
ai-tells.AffirmativeFormulas = error
ai-tells.Metacommentary = error
ai-tells.UrgencyInflation = error
ai-tells.VagueAttributions = error
