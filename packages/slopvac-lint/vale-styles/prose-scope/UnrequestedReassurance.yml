# Over-writing: a sentence answering a worry the reader never raised.
#
# "Nothing here needs a package manager", "the skills work as soon as they are on
# disk", "it leaves nothing behind", "no configuration required". Each reassures
# about the absence of a problem, so it carries no instruction and no fact the
# reader acts on. The honest version is the positive statement alone, or silence:
# a step that needs no setup simply has no setup step.
#
# Distinct from the other prose-scope rules: RejectedAlternative defends a choice
# against an alternative, ImplementationLeak states a cost. This one pre-empts a
# doubt, which is why it reads as sales copy in a reference document.
#
# Anchored to the frame, never to "nothing" or "no" alone: "no rule matches" is a
# measurement and "nothing is committed" states where files live.
extends: existence
message: "unrequested reassurance: %s — state what it does, or say nothing"
level: error
link: https://github.com/srobroek/slopvac/blob/main/vale-styles/README.md
ignorecase: true
raw:
  # "nothing/none of this needs|requires ..."
  - '\b(?:nothing|none of (?:this|it|these))\s+(?:here\s+)?'
  - '(?:needs?|requires?|has to be)\b|'
  # "no setup/config/install required". Narrowed to that band on purpose: "no
  # signing needed" and "no spec change needed" are factual scope notes, and a
  # corpus scan found those outnumber the sales register roughly two to one.
  - '\bno\s+(?:\w+\s+)?(?:setup|configuration|config|install(?:ation)?|dependencies|boilerplate)\s+(?:is\s+)?(?:required|needed|necessary)\b|'
  # "leaves nothing behind", "with zero setup", "out of the box".
  - '\bleaves? (?:nothing|no trace) behind\b|'
  - '\b(?:with )?(?:zero|no) (?:setup|configuration|config|boilerplate|ceremony)\b|'
  - '\bout of the box\b|'
  # "works as soon as ...", "just works", "simply works".
  - '\bworks? (?:as soon as|the moment|right away|immediately|out of)\b|'
  - '\b(?:it |they )?just works?\b|'
  # "you do not have to ..." / "there is no need to ..."
  - '\b(?:you|there) (?:do not|don''t|is no|are no) (?:have to|need to|need)\b|'
  # "don't worry", "rest assured".
  - '\b(?:do not|don''t) worry\b|\brest assured\b'
