name: slopvac
version: 0.1.0
description: >-
  Remove AI writing patterns from prose. Ships the write-docs and review-docs
  skills, a deterministic Vale gate over six granular style packages, a
  SubagentStart hook that carries the rules into every subagent, and a PostToolUse
  hook that gates edited prose. Requires the vale binary on PATH.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
category: docs
tags:
  - skill
  - docs
  - writing
