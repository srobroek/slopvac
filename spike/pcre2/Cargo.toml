[package]
name = "pcre2-matrix-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# pcre2-sys 0.2.10 vendors PCRE2 10.46; 0.2.9 vendors 10.43 (first with bounded variable-length lookbehind).
pcre2-sys = "=0.2.10"
pcre2 = "=0.2.11"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
