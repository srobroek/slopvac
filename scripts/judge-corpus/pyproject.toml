[project]
name = "slopvac-judge-corpus"
version = "0.1.0"
description = "Reproducible provenance-first corpus builder for local typed judging"
requires-python = ">=3.11"
dependencies = ["boto3==1.42.35", "tokenizers==0.22.2"]

[project.scripts]
judge-corpus = "judge_corpus.cli:main"

[tool.setuptools]
# Data directories (models/, sources/, briefs/, ...) sit beside the package.
packages = ["judge_corpus"]

[tool.uv]
package = true
