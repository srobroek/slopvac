# Rust workspace for slopvac 3.0. It sits beside the Python package
# (packages/slopvac-lint), which stays the reference implementation until the
# golden suite passes. Crates live under crates/ so the Python layout is untouched.
[workspace]
resolver = "3"
members = ["crates/*"]
# The cargo-fuzz harness needs nightly and is built only by `just fuzz`.
exclude = ["fuzz"]

[workspace.package]
version = "3.0.0"
edition = "2024"
# Stable is 1.99; the floor trails it by two minor releases so contributors on a
# slightly older toolchain still build. rust-toolchain.toml pins the dev toolchain.
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/slopvac/slopvac"
homepage = "https://github.com/slopvac/slopvac"
publish = false

[workspace.dependencies]
annotate-snippets = "0.12.18"
base64 = "0.23"
cap-fs-ext = "4"
cap-std = "4"
caseless = "0.2"
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
etcetera = "0.11"
flate2 = "1.1"
frontmatter-spans = { path = "crates/frontmatter-spans" }
getrandom = "0.4"
globset = "0.4"
hmac = "0.12"
html5ever = "0.40"
html5gum = "0.9"
ignore = "0.4"
insta = { version = "1.49", features = ["json"] }
# No default features: they pull reqwest and tokio, which ADR 0001 bans (cargo-deny).
jsonschema = { version = "0.61.2", default-features = false }
lsp-server = "0.10"
lsp-types = "0.97"
markdown = "1"
markup5ever_rcdom = "0.40"
minijinja = "3"
minisign = { version = "0.10", default-features = false }
minisign-verify = "0.3"
# Pinned: 0.2.10 vendors PCRE2 10.46; the rules need >= 10.43 (slopvac-8l4.3.20).
pcre2-sys = "=0.2.10"
proc-macro2 = "1"
proptest = "1.12.0"
pulldown-cmark = { version = "0.13", default-features = false }
quote = "1"
rayon = "1.11"
regex = "1"
roxmltree = "0.21"
rstest = "0.28"
rustix = { version = "1", default-features = false, features = [
  "std",
  "process",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
] }
saphyr = "0.3"
# The event parser behind saphyr, pinned to the version saphyr 0.3 uses.
saphyr-parser = "0.3.4"
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1"
sha2 = "0.10"
similar = "3"
slopvac-agents = { path = "crates/slopvac-agents" }
slopvac-comments = { path = "crates/slopvac-comments" }
slopvac-config = { path = "crates/slopvac-config" }
slopvac-context = { path = "crates/slopvac-context" }
slopvac-diagrams = { path = "crates/slopvac-diagrams" }
slopvac-engine = { path = "crates/slopvac-engine" }
slopvac-fs = { path = "crates/slopvac-fs" }
slopvac-lsp = { path = "crates/slopvac-lsp" }
slopvac-messages = { path = "crates/slopvac-messages" }
slopvac-messages-derive = { path = "crates/slopvac-messages-derive" }
slopvac-migrate = { path = "crates/slopvac-migrate" }
slopvac-model = { path = "crates/slopvac-model" }
slopvac-packs = { path = "crates/slopvac-packs" }
slopvac-parse = { path = "crates/slopvac-parse" }
slopvac-pcre2 = { path = "crates/slopvac-pcre2" }
slopvac-plugins = { path = "crates/slopvac-plugins" }
slopvac-pos = { path = "crates/slopvac-pos" }
slopvac-report = { path = "crates/slopvac-report" }
slopvac-rules = { path = "crates/slopvac-rules" }
slopvac-sanitize = { path = "crates/slopvac-sanitize" }
slopvac-styles = { path = "crates/slopvac-styles" }
slopvac-terms = { path = "crates/slopvac-terms" }
slopvac-text = { path = "crates/slopvac-text" }
slopvac-update = { path = "crates/slopvac-update" }
snapbox = { version = "1.2", features = ["cmd"] }
strsim = "0.11.1"
syn = "2"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
toml = "1"
toml_edit = "0.25"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-proto = "0.6"
trybuild = "1"
unicode-normalization = "0.1"
# Pinned exactly: the connector chain in `oci/http.rs` uses ureq's `unversioned`
# transport API, which has no semver promise.
ureq = { version = "=3.5.2", default-features = false, features = [
  "rustls",
  "platform-verifier",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
missing_crate_level_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that mostly add noise for a text-processing codebase.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Profile for cargo-dist release builds.
[profile.dist]
inherits = "release"
