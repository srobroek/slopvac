# Change-genre config: commit messages, PR bodies, release notes.
#
# This file exists because the main config's sections are all extension-globbed,
# and a commit message has no extension. `slop-lint.sh --genre change` on a
# COMMIT_EDITMSG matched no section, so Vale linted nothing and exited 0 -- the
# whole genre passed silently. The `[*]` section below matches any filename.
#
# Genre difference: a change message describes a delta, so the rules that assume
# a steady-state document are wrong here. HistoryNarration is the point of the
# genre, and status words are legitimate when the change IS the status.
StylesPath = styles
MinAlertLevel = warning

Packages = https://github.com/tbhb/vale-ai-tells/releases/latest/download/ai-tells.zip, \
  https://github.com/srobroek/slopvac/releases/download/vale-styles/ai-residue.zip, \
  https://github.com/srobroek/slopvac/releases/download/vale-styles/prose-agency.zip, \
  https://github.com/srobroek/slopvac/releases/download/vale-styles/prose-inflation.zip, \
  https://github.com/srobroek/slopvac/releases/download/vale-styles/docs-discipline.zip, \
  https://github.com/srobroek/slopvac/releases/download/vale-styles/prose-format.zip, \
  https://github.com/srobroek/slopvac/releases/download/vale-styles/prose-craft.zip, \
  https://github.com/srobroek/slopvac/releases/download/vale-styles/prose-inclusive.zip

# `[*]` matches every filename, extension or not. A commit message is plain text
# with no markdown structure, so Vale's text parser is the right one.
[*]
BasedOnStyles = ai-residue, prose-agency, prose-inflation, docs-discipline, prose-format, prose-craft, prose-inclusive, ai-tells
Vale.Repetition = error

# --- Craft rules that invert for this genre ----------------------------------
# A commit message and a PR body are written BY someone ABOUT what they did, so
# the first-person plural is the correct voice here and nowhere else. "We dropped
# the packages glob" is what the genre exists to say.
prose-craft.FirstPersonPlural = NO

# A change message has no headings, no sections, and no table of contents, so the
# structural rules have nothing to measure. SentenceLength would fire on a commit
# subject line, which is one sentence by construction.
prose-craft.GerundHeading = NO
prose-craft.SelfReference = NO
prose-craft.SentenceLength = NO
prose-craft.UndefinedAcronym = NO

# A change message legitimately says "recently" and "last release": it is dated
# by its own commit, so the offset resolves.
prose-craft.RelativeDate = NO

# A commit message rarely reaches the 10-sentence floor the rule needs, and when it
# does the share is dominated by one or two sentences.
prose-density.PassiveDensity = NO

# The prose-density metric divides by sentence count. A one-line commit subject
# has one sentence and scores as unreadable.
#
# Annotations is the inverse: it is switched ON here precisely because
# docs-discipline.StatusLanguage is off below, and a "TODO: write this" in a PR
# body is a defect even though "not yet implemented" is not.

# Describing what changed is the genre's job.
docs-discipline.HistoryNarration = NO

# "planned", "not yet implemented", "for now" are honest in a change message:
# they describe the state this change leaves behind, not a doc that overstays.
docs-discipline.StatusLanguage = NO

# A commit body legitimately cites the spec, ADR, or issue that motivated it.
docs-discipline.InternalRefs = NO

# A commit message is not a document with sections; the prose-block heuristic
# measures paragraph mass against a doc standard that does not apply.
prose-format.ProseBlock = NO

# --- Same measured exclusions as the main config ------------------------------
# Kept in sync deliberately: these are wrong for this corpus in every genre. See
# .vale.ini for the measurement behind each.
ai-tells.OverusedVocabulary = NO
ai-tells.FormalRegister = NO
ai-tells.RedundantPrecaution = NO
ai-tells.GrowthMetaphors = NO
ai-tells.EmDashUsage = NO
ai-tells.FormalTransitions = NO
ai-tells.SemicolonUsage = NO
ai-tells.ColonUsage = NO
ai-tells.ShipOveruse = NO
ai-tells.MicDrop = warning
ai-tells.ParallelStaccato = warning
ai-tells.AICompoundPhrases = warning
ai-tells.VerbTricolon = warning
