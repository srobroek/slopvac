# write-docs prose gate. Replaces the retired slop-lint.py.
#
# Genre routing lives in the section globs below. Vale matches a section against
# the FULL path, and later sections MERGE with earlier ones rather than replacing
# them, so BasedOnStyles is declared once and each genre section carries only its
# overrides.
#
# Three syntax traps, all verified by execution and all silent when wrong:
#   - `|` alternation in a section header matches NOTHING. Use `{a,b}`.
#   - `Style.* = <level>` does NOT demote a whole style. It is accepted and
#     ignored, so every rule kept below its shipped level needs its own line.
#   - An extension with no Vale parser and no `[formats]` alias lints as NOTHING
#     and exits 0. `.tsx` did exactly that. Any extension added to a section
#     below needs a fixture proving it produces findings.
#
# See .audit-2026-07/VALE-MECHANISMS-VERIFIED.md.

StylesPath = styles
MinAlertLevel = warning

# All styles are fetched by `vale sync`; none is committed.
#
# ai-tells uses GitHub's `releases/latest/download/` redirect, so a sync always
# takes the newest upstream release.
#
# Our five styles CANNOT use that redirect. This is a monorepo with ~125
# release-please components, so `releases/latest` resolves to whichever component
# published most recently -- `write-docs--v3.0.0` at the time of writing -- and
# `latest/download/prose-agency.zip` 404s. Both verified. They are published
# instead to a rolling `vale-styles` tag whose assets are clobbered on every
# publish, which gives a stable URL that no unrelated package release can move.
#
# The five are granular on purpose: adopt prose-agency without docs-discipline
# when the house genre rules do not apply. Built by vale-styles/build.sh.
Packages = https://github.com/tbhb/vale-ai-tells/releases/latest/download/ai-tells.zip, \
  https://github.com/srobroek/slopvac/releases/download/vale-styles/ai-residue.zip, \
  https://github.com/srobroek/slopvac/releases/download/vale-styles/prose-agency.zip, \
  https://github.com/srobroek/slopvac/releases/download/vale-styles/prose-inflation.zip, \
  https://github.com/srobroek/slopvac/releases/download/vale-styles/docs-discipline.zip, \
  https://github.com/srobroek/slopvac/releases/download/vale-styles/prose-format.zip, \
  https://github.com/srobroek/slopvac/releases/download/vale-styles/prose-scope.zip, \
  https://github.com/srobroek/slopvac/releases/download/vale-styles/prose-craft.zip, \
  https://github.com/srobroek/slopvac/releases/download/vale-styles/prose-inclusive.zip, \
  https://github.com/srobroek/slopvac/releases/download/vale-styles/prose-density.zip

# `.mdx` is aliased for COVERAGE. Vale CAN parse MDX natively by shelling out to
# `mdx2vast` (npm, same author as Vale), but native parsing skips JSX children,
# and in a component-driven docs site most prose sits inside `<Callout>` /
# `<Note>`. Measured on a fixture: native 1 finding, alias 5. Native also aborts
# the run with exit 1 when the binary is missing, and again on
# `# Heading {#anchor}`. Aliased to md, it reports normally.
#
# There is deliberately NO `tsx`/`jsx` alias. `tsx = html` errors out, and
# `tsx = md` silently reports zero findings -- both verified. Worse, an alias
# defeats Vale's native comment scoping for the source section below. JSX text
# nodes are extracted by scripts/extract-prose.sh instead.
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = ai-residue, prose-agency, prose-inflation, prose-scope, docs-discipline, prose-format, prose-craft, prose-inclusive, prose-density, ai-tells
Vale.Repetition = error

# MDX anchor syntax (`# Heading {#slug}`) is markup, not prose. Lifted from the
# upstream `MDX` config package, which is these two lines and nothing else.
TokenIgnores = '({#[^\n}]+})(?!`)'

# --- ai-tells: disabled -----------------------------------------------------
# ai-tells ships 75 of its 76 rules at level: error. These four are wrong for
# this repo, not merely noisy.

# ~190 tokens of the 2023-mid-2024 lexical era-band that our own appendix
# records as retired (references/ai-tells.md:211-236) -- delve, tapestry,
# testament, intricate, pivotal, meticulous, underscores, multifaceted, myriad,
# plethora -- plus a creative-writing tail (gossamer, labyrinthine) and words
# with ordinary technical uses (comprehensive, granular, scalable). Our
# prose-inflation.SlopLexicon owns the mechanical ban list and is the maintained one.
ai-tells.OverusedVocabulary = NO

# Flags implement / implementation / implementing / framework / frameworks.
# Unusable here: those are correct words in this corpus.
ai-tells.FormalRegister = NO

# One idiom per rule file (over-fitted) and startup-as-organism metaphors
# (domain-narrow). Neither earns a gate.
ai-tells.RedundantPrecaution = NO
ai-tells.GrowthMetaphors = NO

# --- ai-tells: demoted to warning -------------------------------------------

# Replaced by prose-format.NoUnicodeDash, which bans U+2014/U+2013 outright. The
# upstream token list also includes the literal `--`, this repo's sanctioned dash
# form (6,743 uses against 2,124 real Unicode dashes), so it fired ~40 times per
# document on our own convention and buried every other finding.
ai-tells.EmDashUsage = NO

# "Specifically", "likewise", "therefore", "additionally" at error. These are
# ordinary English connectives and this corpus uses them correctly; the rule
# encodes a preference for shorter connectors, not a generated-text signal.
ai-tells.FormalTransitions = NO

# Their own rule comments concede these patterns are over-broad.
ai-tells.MicDrop = warning
ai-tells.ParallelStaccato = warning

# Same dead era-band as OverusedVocabulary (intricate, tapestry, testament,
# pivotal, multifaceted), scored as compound pairs instead of single tokens.
# Demoted for the same reason rather than disabled: the compound form is a
# stronger signal than the bare adjective, so it is worth seeing, not gating on.
ai-tells.AICompoundPhrases = warning

# --- Punctuation-frequency rules: disabled ----------------------------------
# Measured on this corpus (488 tracked *.md): SemicolonUsage fired 612 times and
# ColonUsage 128, and the matches are ordinary correct punctuation -- a semicolon
# joining two independent clauses in a steering rule, a colon before a proper
# noun ("Note: Serena"). These encode a preference about punctuation frequency,
# not an AI tell, and this repo's register uses both deliberately. Keeping them
# at error would gate every doc in the repo on a style opinion.
ai-tells.SemicolonUsage = NO
ai-tells.ColonUsage = NO

# 149 hits, and the rule cannot tell a rhetorical tricolon from a three-item
# technical enumeration ("create, update, and delete"), which this corpus is
# full of. Worth seeing, not gating on.
ai-tells.VerbTricolon = warning

# Domain vocabulary here, not a tell: 53 hits, all the literal verb -- "the
# package ships a skill", "shipped in v2". Disabled rather than demoted because
# in a software repo this word carries no signal at all.
ai-tells.ShipOveruse = NO

# --- Markup surfaces: same treatment as markdown ----------------------------
# Vale parses each of these natively and reports real line:col. Verified by
# fixture, findings-per-file in parentheses: html (5), json (4), yaml (3).
# `.json`/`.yaml` are here for i18n locale files, where shipped UI copy lives.

[*.{html,rst,adoc,json,yaml,yml}]
BasedOnStyles = ai-residue, prose-agency, prose-inflation, prose-scope, docs-discipline, prose-format, prose-craft, prose-inclusive, ai-tells
prose-craft.SentenceLength = NO
prose-craft.GerundHeading = NO
prose-craft.UndefinedAcronym = NO
prose-craft.SelfReference = NO

# --- Source files: comments and docstrings, reduced ruleset ------------------
# Vale is syntax-aware for these formats with no alias and no extractor: it lints
# comments and docstrings and SKIPS identifiers and string literals. Verified --
# `type Loader struct{ comprehensive bool }` and `var Msg = "robust seamless"`
# both score zero while the doc comment above them is flagged.
#
# The ruleset is an allowlist, not the full set. Measured across 55 shell and
# Python files in this repo: the full set produced 214 findings, almost all
# false. Code-comment register is terse and legitimately negative -- a test named
# "No PCRE, no \b" trips ContrastiveNegation. The allowlist below scored 8
# findings on the same 55 files, 7 of them the ban list quoted inside
# inject-doc-discipline.sh.
#
# NoUnicodeDash IS in the allowlist. An earlier revision excluded it on the
# reading that it was firing on this repo's `--` convention; that was wrong. The
# rule cannot match `--`, and the 172 hits were real U+2014/U+2013 in source
# comments (ground truth: 206 Unicode dashes against 2,591 ASCII `--` across the
# same files). A Unicode dash in code is a defect in any register, so it errors
# here too, and the rule carries `scope: raw` to reach inside code fences.
#
# Every rule here is one whose match is a defect in any register: a marketing
# adjective, a chat artifact, jargon, a deleted actor. Structural and
# punctuation-frequency rules are excluded by design; add one only with a
# corpus measurement.
[*.{go,rs,py,ts,js,mjs,cjs,tsx,jsx,java,rb,c,h,cpp,cs,swift,kt,php,sh,bash,lua}]
BasedOnStyles =
prose-inflation.SlopLexicon = error
ai-residue.ChatLeakage = error
docs-discipline.StatusLanguage = error
prose-inflation.BusinessJargon = error
prose-agency.FalseAgency = error
prose-inflation.VagueDeclarative = error
prose-agency.AgentlessPassive = error
prose-agency.Anthropomorphism = error
prose-agency.UnattributedRecommendation = error
prose-inflation.AdditiveHedge = error
prose-format.NoUnicodeDash = error
ai-tells.AffirmativeFormulas = error
ai-tells.Metacommentary = error
ai-tells.UrgencyInflation = error
ai-tells.VagueAttributions = error
prose-craft.ConflictMarkers = error
prose-craft.Redundancy = error
prose-inflation.Uncomparables = error
prose-inflation.Intensifier = error
prose-inflation.HedgeStack = error
prose-inclusive.Exclusive = error
prose-inclusive.Ableist = error

# This script quotes the ban list it enforces, exactly like ai-tells.md below.
[**/inject-doc-discipline.sh]
BasedOnStyles =

# --- Genre routing ----------------------------------------------------------

# Internal docs legitimately cite specs, ADRs, and the constitution: that is
# what they are for. E3 is a consumer-docs rule only.
# An ADR, spec, or constitution is where a decision and its measurement belong,
# so the over-writing rules invert for those paths: the content the other genres
# must not carry is exactly what these exist to record.
[**/{specs,.specify}/**/*.md]
docs-discipline.InternalRefs = NO
prose-scope.RejectedAlternative = NO
prose-scope.ImplementationLeak = NO
prose-craft.FirstPersonPlural = NO
prose-craft.NegativeRequirement = NO
prose-craft.SelfReference = NO
prose-craft.UndefinedAcronym = NO

[**/{adr,ADR}/**/*.md]
docs-discipline.InternalRefs = NO
prose-scope.RejectedAlternative = NO
prose-scope.ImplementationLeak = NO
prose-craft.FirstPersonPlural = NO
prose-craft.NegativeRequirement = NO
prose-craft.SelfReference = NO
prose-craft.UndefinedAcronym = NO

[**/{CONTRIBUTING,constitution}*.md]
docs-discipline.InternalRefs = NO
prose-scope.RejectedAlternative = NO
prose-scope.ImplementationLeak = NO
prose-craft.FirstPersonPlural = NO
prose-craft.NegativeRequirement = NO
prose-craft.SelfReference = NO
prose-craft.UndefinedAcronym = NO

# The tells catalogue quotes every tell it documents, by design, so the files that
# carry example text are excluded wholesale rather than holding dozens of inline
# suppressions. The index (ai-tells.md) quotes nothing and IS gated -- splitting the
# monolith is what made that possible.
# A reference table has no sentences, so reading ease divides by near-zero and
# scores a correct table as unreadable. Measured: 10.6 and -36.8 on two files here.
[**/references/**/*.md]
prose-density.Overwritten = NO

[**/{ai-tells,ai-tells/*}.md]
BasedOnStyles =

# Same reason: this package's own rule text quotes the ban lists it enforces, so
# `NOT Status language: "coming soon", ...` trips the rule it is teaching, and the
# genre references cite "it was decided" as the thing not to write. Every file
# matched here is normative source for the gate, not prose the gate should judge.
[**/{SKILL,write-docs.write-docs-index.context,consumer-docs,change-comms,internal-docs}.md]
docs-discipline.StatusLanguage = NO
docs-discipline.HistoryNarration = NO
prose-inflation.SlopLexicon = NO
prose-inflation.BusinessJargon = NO
prose-agency.FalseAgency = NO
prose-agency.AgentlessPassive = NO
prose-agency.NarratorDistance = NO
prose-inflation.VagueDeclarative = NO
prose-inflation.AdditiveHedge = NO
ai-residue.ChatLeakage = NO
prose-scope.RejectedAlternative = NO
prose-scope.ImplementationLeak = NO
prose-scope.UnrequestedReassurance = NO
prose-scope.Epigram = NO
docs-discipline.InternalRefs = NO
ai-tells.ContrastiveNegation = NO
prose-inflation.VagueQuantifier = NO
prose-inflation.Intensifier = NO
prose-inflation.Apologizing = NO
prose-inflation.HedgeStack = NO
prose-inflation.Uncomparables = NO
prose-inclusive.Exclusive = NO
prose-inclusive.Ableist = NO
prose-inclusive.DeviceAssumption = NO
prose-craft.Annotations = NO
prose-craft.Redundancy = NO
prose-craft.Latinisms = NO
prose-craft.DirectionalRef = NO
prose-craft.Politeness = NO
prose-craft.DocumentPreamble = NO

# The write-docs package README documents the docs-discipline rules, which means
# naming the internal-reference surfaces they cover.
[**/{slopvac,write-docs}/README.md]
docs-discipline.InternalRefs = NO

# The style docs quote every pattern they document, by design.
# The rule reference in vale-styles/README.md is GENERATED from the rule files, and
# each rule's summary quotes the pattern it bans -- so the table trips the rules it
# documents. Same reason the ai-tells catalogue files are excluded: this is
# normative source for the gate, not prose the gate should judge.
[**/vale-styles/README.md]
BasedOnStyles =

# --- Generated by other tools ------------------------------------------------
# `bd init` writes and rewrites these on every upgrade, so a fix here is undone
# by the next `bd` release. Exclude them rather than editing a file this project
# does not own.
[**/{AGENTS,CLAUDE,GEMINI}.md]
BasedOnStyles =

[**/.beads/**]
BasedOnStyles =

[**/.agents/**]
BasedOnStyles =

# --- Agent routing files -----------------------------------------------------
# An `*.instructions.md` file exists to tell an agent WHICH genres route here, so
# it enumerates document types by name -- "spec", "ADR", "constitution". That is
# the trigger list, not a link to an internal document, and InternalRefs cannot
# tell the two apart.
[**/*.instructions.md]
docs-discipline.InternalRefs = NO
