name: Assemble harness PR
on:
  pull_request:
    paths: ['.github/workflows/assemble-harness-pr.yml']
permissions:
  contents: read
jobs:
  assemble:
    if: >-
      github.repository == 'srobroek/slopvac' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/cli-harness-steering'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply verified patch
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a2f444abb12218f6d88a483d303008e31cebdf3e HEAD
          python3 - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          encoded = ''.join(Path(f'.pr-assembly/init-{i}.b64').read_text() for i in range(4))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '6aef07cd8c71b57767222918a465e0067746bec01405f6e565b4a5220272cded'
          payload = json.loads(raw)
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', '-'], input=payload['patch'].encode(), check=True)
          for name in payload['deletes']:
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              subprocess.run(['git', 'rm', '--', name], check=True)
          subprocess.run(['git', 'rm', '-r', '--', '.pr-assembly', '.github/workflows/assemble-harness-pr.yml'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == 'ba62a12bca920983bd0ab4311ae6d3b3f79707fd', tree
          print('Verified assembled source tree:', tree)
          PY
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Validate CLI changes
        run: |
          set -euo pipefail
          uvx ruff@0.16.3 check --select I001,F401 --fix \
            packages/slopvac-lint/src/slopvac/agent_cli.py \
            packages/slopvac-lint/tests/test_agent_cli.py
          git add packages/slopvac-lint/src/slopvac/agent_cli.py packages/slopvac-lint/tests/test_agent_cli.py
          test "$(git write-tree)" = 065bf7626882a13b80c9db2316b46ca6732998aa
          uv run --project packages/slopvac-lint --with pytest python -m pytest -q \
            packages/slopvac-lint/tests/test_agent_cli.py packages/slopvac-lint/tests/test_reference.py \
            tests/test_cli_distribution.py tests/test_prose_scope_contract.py
          uvx ruff@0.16.3 check packages/slopvac-lint/src/slopvac/agent_cli.py \
            packages/slopvac-lint/src/slopvac/agent_context.py packages/slopvac-lint/src/slopvac/steering.py \
            packages/slopvac-lint/tests/test_agent_cli.py
      - name: Publish verified Git objects without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request
          base = 'a2f444abb12218f6d88a483d303008e31cebdf3e'
          def git(*args):
              return subprocess.check_output(['git', *args])
          def post(endpoint, data):
              request = urllib.request.Request('https://api.github.com/repos/srobroek/slopvac/git/' + endpoint,
                  data=json.dumps(data).encode(), method='POST', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          entries = []
          changes = git('diff', '--cached', '--no-renames', '--name-status', '-z', base).decode().split('\0')
          for status, path in zip(changes[0::2], changes[1::2]):
              if status == 'D':
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode = git('ls-files', '--stage', '--', path).decode().split()[0]
              data = git('show', ':' + path)
              blob = post('blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode()})
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          tree = post('trees', {'base_tree': git('rev-parse', base + '^{tree}').decode().strip(), 'tree': entries})
          assert tree['sha'] == '065bf7626882a13b80c9db2316b46ca6732998aa', tree['sha']
          commit = post('commits', {'message': 'feat!: replace skills and marketplaces with CLI harness steering',
              'tree': tree['sha'], 'parents': [git('rev-parse', 'HEAD').decode().strip()]})
          print('ASSEMBLED_COMMIT', commit['sha'])
          print('ASSEMBLED_TREE', tree['sha'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'w') as summary:
              summary.write('Verified CLI migration: ' + commit['sha'] + '\n32 focused tests and Ruff passed. Branch not moved.\n')
          PY
