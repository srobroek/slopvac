name: Assemble harness PR
on:
  pull_request:
    paths: ['.github/workflows/assemble-harness-pr.yml']
permissions:
  contents: read
jobs:
  assemble:
    if: >-
      github.repository == 'srobroek/slopvac' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/cli-harness-steering'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Apply verified patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = a2f444abb12218f6d88a483d303008e31cebdf3e
          python3 - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          encoded = ''.join(Path(f'.pr-assembly/init-{i}.b64').read_text() for i in range(4))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '6aef07cd8c71b57767222918a465e0067746bec01405f6e565b4a5220272cded'
          payload = json.loads(raw)
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', '-'], input=payload['patch'].encode(), check=True)
          for name in payload['deletes']:
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              subprocess.run(['git', 'rm', '--', name], check=True)
          subprocess.run(['git', 'rm', '-r', '--', '.pr-assembly', '.github/workflows/assemble-harness-pr.yml'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == 'ba62a12bca920983bd0ab4311ae6d3b3f79707fd', tree
          print('Verified assembled source tree:', tree)
          PY
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Validate CLI changes
        run: |
          set -euo pipefail
          uv run --project packages/slopvac-lint --with pytest python -m pytest -q \
            packages/slopvac-lint/tests/test_agent_cli.py \
            packages/slopvac-lint/tests/test_reference.py \
            tests/test_cli_distribution.py tests/test_prose_scope_contract.py
          uvx ruff@0.16.3 check packages/slopvac-lint/src/slopvac/agent_cli.py \
            packages/slopvac-lint/src/slopvac/agent_context.py \
            packages/slopvac-lint/src/slopvac/steering.py \
            packages/slopvac-lint/tests/test_agent_cli.py
      - name: Commit to the feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'feat!: replace skills and marketplaces with CLI harness steering'
          python3 - <<'PY'
          import base64, os, subprocess
          credential = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          env = dict(os.environ, GIT_CONFIG_COUNT='1',
                     GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
                     GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + credential)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/feat/cli-harness-steering'], env=env, check=True)
          PY
