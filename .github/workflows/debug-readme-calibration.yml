name: Temporary README calibration diagnostic

on:
  pull_request:
    paths:
      - "packages/slopvac-lint/README.md"
      - ".github/workflows/debug-readme-calibration.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/refresh-slopvac-lint-readme
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --quiet -e "./packages/slopvac-lint"
      - name: Show calibration findings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from slopvac.analyze import parse
          from slopvac.config import Config, Profile, resolve_for
          from slopvac.engine import Engine
          from slopvac.metrics import paragraph_words_stdev
          from slopvac.rules import load_ruleset

          readme = Path("packages/slopvac-lint/README.md")
          document = parse(str(readme), readme.read_text(encoding="utf-8"))
          config = Config(profile=Profile.STRICT)
          object.__setattr__(config, "root", Path("/repo"))
          engine = Engine(
              load_ruleset().rules,
              resolve_for(config, Path("/repo/a.md")),
          )
          wanted = {
              "ai-tells-register.uniform-paragraph-mass",
              "ste-nouns.multiword-noun-too-long",
              "ai-tells-content-shape.adjective-per-noun-spray",
          }
          print("paragraphs", len(document.paragraphs), "words", sum(s.word_count for s in document.sentences))
          print("paragraph_words_stdev", paragraph_words_stdev(document))
          for finding in engine.run(document):
              if finding.rule_id in wanted:
                  print(finding.model_dump_json())
          PY
