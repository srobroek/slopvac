name: Check Vale styles

# Builds every style in vale-styles/ and proves each one syncs and fires.
#
# Publishing is NOT here: it runs from release-please.yml, gated on the
# `vale-styles` component's `release_created`, so the rolling tag moves once per
# released rule change rather than on every push. This workflow is the gate that
# stops a broken zip reaching that tag.

on:
  pull_request:
    paths:
      - "vale-styles/**"
      - "README.md"
      - ".github/workflows/check-vale-styles.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Install Vale
        run: |
          set -euo pipefail
          version=3.15.2
          curl -sSfL -o vale.tar.gz \
            "https://github.com/errata-ai/vale/releases/download/v${version}/vale_${version}_Linux_64-bit.tar.gz"
          tar -xzf vale.tar.gz vale
          sudo install -m 0755 vale /usr/local/bin/vale
          vale --version

      # The rule tables in both READMEs are generated from the rule files. This
      # fails when a rule was added, renamed, or re-levelled without regenerating,
      # which is the only way the published docs can disagree with the shipped
      # rules.
      - name: Check the rule tables are current
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          ./vale-styles/gen-rule-table.py --check

      - name: Build packages
        run: ./vale-styles/build.sh

      # A style that syncs but resolves no rules lints every file as clean and
      # exits 0, so verify each package produces the findings it should before
      # publishing. Serves the built zips because Vale rejects file:// URLs.
      - name: Verify each package syncs and fires
        run: |
          set -euo pipefail
          python3 -m http.server 8899 --directory vale-styles/dist &
          server=$!
          trap 'kill "$server"' EXIT
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null "http://localhost:8899/prose-agency.zip" && break
            sleep 0.5
          done

          work="$(mktemp -d)"
          cd "$work"
          base=http://localhost:8899
          {
            echo "StylesPath = styles"
            echo "MinAlertLevel = warning"
            printf 'Packages = '
            printf '%s/ai-residue.zip, ' "$base"
            printf '%s/prose-agency.zip, ' "$base"
            printf '%s/prose-inflation.zip, ' "$base"
            printf '%s/docs-discipline.zip, ' "$base"
            printf '%s/prose-format.zip, ' "$base"
            printf '%s/prose-craft.zip, ' "$base"
            printf '%s/prose-inclusive.zip, ' "$base"
            printf '%s/prose-density.zip\n' "$base"
            echo "[*.md]"
            printf 'BasedOnStyles = ai-residue, prose-agency, '
            printf 'prose-inflation, docs-discipline, prose-format, '
            printf 'prose-craft, prose-inclusive, prose-density\n'
          } > .vale.ini
          vale sync

          for style in ai-residue prose-agency prose-inflation docs-discipline \
            prose-format prose-craft prose-inclusive prose-density; do
            test -d "styles/$style" || { echo "$style did not sync"; exit 1; }
          done

          # One probe per style: each line must be caught by the style named.
          cat > probe.md <<'PROBE'
          As of my last update, I cannot verify this.
          The complaint becomes a fix once the decision emerges.
          The library leverages a robust parser and the reasons are structural.
          This module is under construction; previously we used X.
          In order to configure it, utilize a HTML file. There is a flag for this.
          The blacklist uses a master/slave setup with dummy data.
          In order to configure it, utilize a HTML file and select the file(s).
          PROBE

          # prose-density scores the WHOLE FILE, not a line, so it needs a probe of
          # its own: mixed with the plain lines above, the aggregate reading ease
          # lands above the threshold and the rule reports nothing.
          cat > dense.md <<'DENSE'
          The utilization of the aforementioned methodology facilitates the
          optimization of operational efficiency in a manner that is both effective
          and efficacious, thereby enabling the achievement of the desired
          organizational outcomes within the requisite implementation timeframe.
          DENSE
          vale --output=JSON --no-exit probe.md dense.md > out.json
          for style in ai-residue prose-agency prose-inflation docs-discipline \
            prose-craft prose-inclusive prose-density; do
            grep -q "\"$style\." out.json || {
              echo "$style produced no findings on its probe line"
              cat out.json
              exit 1
            }
          done
          echo "all styles synced and fired"
