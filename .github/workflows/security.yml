name: Security

on:
  workflow_call:
    inputs:
      code:
        required: false
        type: boolean
        default: false
      dependencies:
        required: false
        type: boolean
        default: false
      filesystem:
        required: false
        type: boolean
        default: false
      secrets:
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  trufflehog:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.secrets }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan pull request diff
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@64d939a56362f519781c53ea09b27f8d1dc0140a # v3.97.6
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          version: 3.97.4
          extra_args: --results=verified
      - name: Scan pushed commits
        if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@64d939a56362f519781c53ea09b27f8d1dc0140a # v3.97.6
        with:
          path: ./
          version: 3.97.4
          extra_args: --results=verified
      - name: Scan full tree
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@64d939a56362f519781c53ea09b27f8d1dc0140a # v3.97.6
        with:
          path: ./
          version: 3.97.4
          extra_args: --results=verified

  codeql:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.code }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

  osv:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan uv.lock
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=osv-results.json
            --lockfile=uv.lock
      - name: Create SARIF report
        if: always()
        uses: google/osv-scanner-action/osv-reporter-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --output=osv-results.sarif
            --new=osv-results.json
            --gh-annotations=true
            --fail-on-vuln=true
      - name: Upload OSV SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: osv-results.sarif

  trivy:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.filesystem }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-results.sarif

  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs: [trufflehog, codeql, osv, trivy]
    if: always()
    steps:
      - name: Verify required scanners and valid skips
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          CODE: ${{ inputs.code }}
          DEPENDENCIES: ${{ inputs.dependencies }}
          FILESYSTEM: ${{ inputs.filesystem }}
          SECRETS: ${{ inputs.secrets }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["RESULTS"])
          full = os.environ["EVENT_NAME"] in {"schedule", "workflow_dispatch"}

          def flag(name):
              return os.environ.get(name, "").lower() == "true"

          expected = {
              "trufflehog": full or flag("SECRETS"),
              "codeql": full or flag("CODE"),
              "osv": full or flag("DEPENDENCIES"),
              "trivy": full or flag("FILESYSTEM"),
          }

          problems = []
          for name, should_run in expected.items():
              actual = needs[name]["result"]
              wanted = "success" if should_run else "skipped"
              if actual != wanted:
                  problems.append(f"{name}: got {actual}, expected {wanted}")
              else:
                  print(f"{name}: {actual} (expected)")

          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)

          print("security scanners ran or skipped exactly as classified")
          PY
