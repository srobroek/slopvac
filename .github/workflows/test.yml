name: CI

# One always-triggered workflow owns pull-request CI. Individual jobs are skipped
# with job-level conditions so required checks never disappear because an entire
# workflow was path-filtered.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      package: ${{ steps.filter.outputs.package }}
      action: ${{ steps.filter.outputs.action }}
      docs: ${{ steps.filter.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci }}
      config: ${{ steps.filter.outputs.config }}
      shell: ${{ steps.filter.outputs.shell }}
      precommit: ${{ steps.filter.outputs.precommit }}
      complexity: ${{ steps.filter.outputs.complexity }}
      lint: ${{ steps.filter.outputs.lint }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      filesystem: ${{ steps.filter.outputs.filesystem }}
      security: ${{ steps.filter.outputs.security }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/ci-paths.yml

      - name: Report classification
        env:
          MATCHED: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail
          echo "Matched CI classes: $MATCHED"
          {
            echo "## CI change classification"
            echo
            echo "\`$MATCHED\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deliberately small and always on. This catches basic Python regressions and
  # malformed hook manifests even for docs/config-only changes.
  quick-lint:
    name: Quick lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Ruff
        working-directory: packages/slopvac-lint
        run: uvx ruff@0.16.3 check .

      - name: Validate hook JSON
        run: |
          set -euo pipefail
          files="$(git ls-files '*hooks.json' | sort -u)"
          test -n "$files" || { echo 'no manifests found to validate'; exit 1; }
          for f in $files; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok $f"
          done

  # Full repository test discovery on the newest supported Python. The root
  # pytest configuration includes both package tests and any repository-level
  # tests, so new test directories cannot silently sit outside CI.
  test:
    name: Full test suite
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Vale
        run: python3 scripts/install_vale.py --prefix "$HOME/.local/bin" 3.15.2
      - name: Add Vale to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ast-grep
        run: |
          set -euo pipefail
          python3 -m pip install --quiet ast-grep-cli==0.45.3
          ast-grep --version

      - name: Install package and test dependencies
        run: python3 -m pip install --quiet -e "./packages/slopvac-lint[dev]"

      - name: Run every discovered pytest suite
        run: python3 -m pytest

  # Exercise the published package across every Python version claimed in
  # project metadata. This is intentionally separate from the full-suite job.
  lint-package:
    name: slopvac (py${{ matrix.python }})
    needs: changes
    if: ${{ needs.changes.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        working-directory: packages/slopvac-lint
        run: uv pip install --system -e ".[dev]"

      - name: Install Vale
        run: python3 scripts/install_vale.py --prefix "$HOME/.local/bin" 3.15.2
      - name: Add Vale to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: pytest
        working-directory: packages/slopvac-lint
        run: python3 -m pytest tests -q

      - name: Ruleset loads for every locale
        working-directory: packages/slopvac-lint
        run: |
          set -euo pipefail
          for locale in en-US en-GB und; do
            printf 'Checking %s\n' "$locale"
            slopvac rules --format json > /dev/null
            printf 'A robust tool.\n' > /tmp/probe.md
            set +e
            slopvac /tmp/probe.md --locale "$locale" > /dev/null
            status=$?
            set -e
            test "$status" -ne 2 || { echo "locale $locale broke the run"; exit 1; }
          done

      - name: The rules reference is current
        if: matrix.python == '3.13'
        working-directory: packages/slopvac-lint
        run: slopvac reference --write docs/rules.md --check

      - name: The README's own commands work
        working-directory: packages/slopvac-lint
        run: |
          set -euo pipefail
          slopvac --version
          slopvac rules --format json > /tmp/rules.json
          python3 - <<'PY'
          import json
          payload = json.load(open("/tmp/rules.json"))
          assert len(payload["rules"]) == 167
          assert all(rule["kind"] != "judgement" for rule in payload["rules"])
          PY
          slopvac explain orwell.stale-figure > /dev/null
          slopvac init --path /tmp/slopvac.toml --skip-agents
          slopvac /tmp/probe.md --config /tmp/slopvac.toml || test $? -eq 1

  cli-e2e:
    name: CLI contract
    needs: changes
    if: ${{ needs.changes.outputs.package == 'true' || needs.changes.outputs.docs == 'true' }}
    uses: ./.github/workflows/cli-e2e.yml
    permissions:
      contents: read
    with:
      package: ${{ needs.changes.outputs.package == 'true' }}
      docs: ${{ needs.changes.outputs.docs == 'true' }}

  action-contract:
    name: Composite action contract
    needs: changes
    if: ${{ needs.changes.outputs.action == 'true' }}
    uses: ./.github/workflows/action-test.yml
    permissions:
      contents: read

  lint:
    name: Relevant lint suites
    needs: changes
    if: ${{ needs.changes.outputs.lint == 'true' }}
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
      security-events: write
    with:
      code: ${{ needs.changes.outputs.code == 'true' }}
      docs: ${{ needs.changes.outputs.docs == 'true' }}
      ci: ${{ needs.changes.outputs.ci == 'true' }}
      config: ${{ needs.changes.outputs.config == 'true' }}
      shell: ${{ needs.changes.outputs.shell == 'true' }}
      precommit: ${{ needs.changes.outputs.precommit == 'true' }}
      complexity: ${{ needs.changes.outputs.complexity == 'true' }}
      action: ${{ needs.changes.outputs.action == 'true' }}

  markdown-audit:
    name: Markdown audit
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    uses: ./.github/workflows/markdown-audit.yml
    permissions:
      contents: read

  security:
    name: Relevant security suites
    needs: changes
    if: ${{ needs.changes.outputs.security == 'true' }}
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
    with:
      code: ${{ needs.changes.outputs.code == 'true' }}
      dependencies: ${{ needs.changes.outputs.dependencies == 'true' }}
      filesystem: ${{ needs.changes.outputs.filesystem == 'true' }}
      secrets: true

  # Keep the established required-check name, but make it the single source of
  # truth for the whole CI graph. It enforces exact skip semantics: a suite must
  # succeed when its path class matched and must be skipped when it did not.
  gate:
    name: Tests gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - quick-lint
      - test
      - lint-package
      - cli-e2e
      - action-contract
      - lint
      - markdown-audit
      - security
    if: always()
    steps:
      - name: Verify required runs and valid skips
        env:
          RESULTS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
          PACKAGE: ${{ needs.changes.outputs.package }}
          ACTION: ${{ needs.changes.outputs.action }}
          LINT: ${{ needs.changes.outputs.lint }}
          DOCS: ${{ needs.changes.outputs.docs }}
          SECURITY: ${{ needs.changes.outputs.security }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["RESULTS"])
          problems = []

          if needs["changes"]["result"] != "success":
              problems.append(
                  f"change classification was {needs['changes']['result']}, expected success"
              )

          expected = {
              "quick-lint": True,
              "test": os.environ["CODE"] == "true",
              "lint-package": os.environ["PACKAGE"] == "true",
              "cli-e2e": os.environ["PACKAGE"] == "true" or os.environ["DOCS"] == "true",
              "action-contract": os.environ["ACTION"] == "true",
              "lint": os.environ["LINT"] == "true",
              "markdown-audit": os.environ["DOCS"] == "true",
              "security": os.environ["SECURITY"] == "true",
          }

          for name, should_run in expected.items():
              actual = needs[name]["result"]
              wanted = "success" if should_run else "skipped"
              if actual != wanted:
                  problems.append(f"{name}: got {actual}, expected {wanted}")
              else:
                  print(f"{name}: {actual} (expected)")

          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)

          print("all CI suites ran or skipped exactly as classified")
          PY

  # Compatibility shims for repositories that still require the old lint/security
  # gate names. They contain no independent policy; Tests gate is authoritative.
  lint-gate-compat:
    name: gate
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Mirror central gate
        env:
          RESULT: ${{ needs.gate.result }}
        run: test "$RESULT" = "success"

  security-gate-compat:
    name: security-gate
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Mirror central gate
        env:
          RESULT: ${{ needs.gate.result }}
        run: test "$RESULT" = "success"
