name: Publish Vale styles

# Builds vale-styles/ into one zip per style and uploads them to the rolling
# `vale-styles` release tag, which is what the URLs in the scaffolded .vale.ini
# point at. Assets are replaced on every publish, so a consumer takes new rules
# with `vale sync` and never edits a URL.
#
# `--latest=false` keeps this release out of the repo's "Latest" marker, so the
# package releases stay the ones a marketplace resolves.

on:
  push:
    branches: [main]
    paths:
      - "vale-styles/**"
      - ".github/workflows/publish-vale-styles.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Build packages
        run: ./vale-styles/build.sh

      - name: Publish to the rolling vale-styles tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view vale-styles >/dev/null 2>&1; then
            gh release upload vale-styles vale-styles/dist/*.zip --clobber
          else
            gh release create vale-styles vale-styles/dist/*.zip \
              --title "Vale styles" \
              --notes "Rolling release. Assets are replaced on every publish; see vale-styles/README.md." \
              --latest=false
          fi
