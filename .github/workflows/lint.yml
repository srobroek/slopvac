name: Lint
# Workflow, YAML, and shell hygiene, plus this repo's own prose gate run against its
# own documentation.
on:
  workflow_call:
    inputs:
      code:
        required: true
        type: boolean
      docs:
        required: true
        type: boolean
      ci:
        required: true
        type: boolean
      config:
        required: true
        type: boolean
      shell:
        required: true
        type: boolean
      precommit:
        required: true
        type: boolean
      complexity:
        required: true
        type: boolean
      action:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  workflow-lint:
    if: ${{ inputs.ci }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install actionlint
        run: |
          set -euo pipefail
          version=1.7.7
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0
        env:
          BINSTALL_DISABLE_TELEMETRY: "true"
      - name: Install agnix
        run: cargo binstall agnix-cli@0.52.2 --no-confirm
      - name: Test staged agnix gate
        run: python3 scripts/test-agnix-hook.py
      - name: Check PR agnix inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse "${HEAD_SHA}^")"
          fi
          index="$(mktemp)"
          rm -f "$index"
          trap 'rm -f "$index"' EXIT
          export GIT_INDEX_FILE="$index"
          git read-tree "$HEAD_SHA"
          export AGNIX_DIFF_BASE="$base"
          python3 scripts/check-agnix-staged.py
      - name: actionlint
        run: actionlint .github/workflows/*.yml
      - name: Install zizmor
        run: pip install "zizmor==1.6.0"
      - name: zizmor
        run: zizmor .github/workflows/*.yml
      - name: Install yamllint
        run: pip install "yamllint==1.37.1"
      - name: yamllint
        run: yamllint -c .yamllint.yml .github/workflows/ .github/ci-paths.yml
  typos:
    if: ${{ inputs.code || inputs.docs || inputs.ci }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0
      - name: Install typos
        run: cargo binstall typos-cli@1.50.2 --no-confirm
      - name: typos
        run: typos .

  lychee:
    if: ${{ inputs.docs }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0
      - name: Install lychee
        run: cargo binstall lychee@0.24.2 --no-confirm
      - name: lychee
        run: >-
          lychee --config .lychee.toml --no-progress README.md
          packages/slopvac-lint/README.md packages/slopvac-lint/docs/

  markdownlint:
    if: ${{ inputs.docs }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.18.1

  taplo:
    if: ${{ inputs.config }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: taplo
        run: uvx taplo@0.9.3 fmt --check

  pinact:
    if: ${{ inputs.ci || inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify action pins
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false"
          skip_push: "true"
  prek:
    if: ${{ inputs.precommit }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Run configured hooks
        run: uvx prek@0.5.2 run --all-files

  complexity:
    if: ${{ inputs.complexity }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Measure target complexity
        run: |
          set -euo pipefail
          set +e
          uvx lizard==1.24.0 packages/slopvac-lint/src/slopvac/cli.py \
            packages/slopvac-lint/src/slopvac/score.py -C 15 \
            > /tmp/lizard.txt
          status=$?
          set -e
          if (( status > 1 )); then
            exit "$status"
          fi
          cat /tmp/lizard.txt
          python3 - <<'PY'
          from pathlib import Path

          report = Path("/tmp/lizard.txt").read_text()
          warnings = report.split("!!!! Warnings", 1)[1] if "!!!! Warnings" in report else ""
          targets = (" lint@", " score_document@")
          failed = [line for line in warnings.splitlines() if any(t in line for t in targets)]
          if failed:
              raise SystemExit("target complexity exceeded 15:\n" + "\n".join(failed))
          PY

  shell-lint:
    if: ${{ inputs.shell }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find . -name '*.sh' -not -path './.git/*' -exec shellcheck --severity=warning {} +
  python-lint:
    if: ${{ inputs.code }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # `check` only, not `format`. The rule provenance comments in this package are
      # its documentation, and the formatter rewraps them; the selected rule set is
      # the part that finds defects. It has already found a dead version branch, two
      # duplicate set members that silently did nothing, and 16 `raise SystemExit`
      # calls inside `except` with no `from None`, each printing a chained traceback
      # over its own error message.
      #
      # The version is pinned. An unpinned linter turns a new release into a red
      # build on an untouched branch.
      - name: ruff
        working-directory: packages/slopvac-lint
        run: uvx ruff@0.16.3 check .
  # Runs this repo's own action against this repo, from the working tree rather
  # than a published tag. A composite action that breaks is only visible when it
  # is executed, and no unit test executes one.
  action:
    if: ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # the SARIF upload
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # changed-files-only needs the merge base
      - name: Run the action on this repo's docs
        id: slopvac
        uses: ./
        with:
          paths: README.md packages/slopvac-lint/README.md packages/slopvac-lint/docs
          source: ./packages/slopvac-lint # the working tree, not the last release
          sarif: "true"
          # This repository's authored prose passes the configured thresholds;
          # keep the dogfood run blocking so regressions cannot land unnoticed.
          fail-on-findings: "true"
      - name: Report what the action returned
        env:
          SCORE: ${{ steps.slopvac.outputs.score }}
          FINDINGS: ${{ steps.slopvac.outputs.findings }}
          ERRORS: ${{ steps.slopvac.outputs.errors }}
          PASSED: ${{ steps.slopvac.outputs.passed }}
          SARIF: ${{ steps.slopvac.outputs.sarif }}
        run: |
          set -euo pipefail
          echo "score=$SCORE findings=$FINDINGS errors=$ERRORS passed=$PASSED"
          # An empty output means the step exited before writing them, which is a
          # broken action reported as a clean run.
          test -n "$SCORE" || { echo "the action returned no score"; exit 1; }
          test -s "$SARIF" || { echo "the action wrote no SARIF"; exit 1; }
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$SARIF"
  prose:
    if: ${{ inputs.docs }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The gate step below runs the linter through uvx, which the runner image does not
      # carry. Without this the step exits 127 on `uvx: command not found`, after vale has
      # already installed and the styles have built.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install vale
        run: python3 scripts/install_vale.py --prefix "$HOME/.local/bin" 3.15.2
      - name: Add vale to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Gate this repo's own docs
        run: |
          set -euo pipefail
          # `docs/` is passed as a directory, not as a list of files. The two
          # specimen files inside it are excluded in `slopvac.toml`, so a new doc
          # is gated the moment it is added instead of being silently unchecked.
          uvx --from ./packages/slopvac-lint slopvac lint \
            README.md packages/slopvac-lint/README.md \
            packages/slopvac-lint/docs
  # Internal consistency gate for the reusable lint suite. A skipped job is
  # accepted only when the caller explicitly classified it as irrelevant.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - workflow-lint
      - typos
      - lychee
      - markdownlint
      - taplo
      - pinact
      - prek
      - complexity
      - shell-lint
      - python-lint
      - action
      - prose
    if: always()
    steps:
      - name: Verify required lint runs and valid skips
        env:
          RESULTS: ${{ toJSON(needs) }}
          CODE: ${{ inputs.code }}
          DOCS: ${{ inputs.docs }}
          CI: ${{ inputs.ci }}
          CONFIG: ${{ inputs.config }}
          SHELL: ${{ inputs.shell }}
          PRECOMMIT: ${{ inputs.precommit }}
          COMPLEXITY: ${{ inputs.complexity }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["RESULTS"])

          def flag(name):
              return os.environ[name].lower() == "true"

          expected = {
              "workflow-lint": flag("CI"),
              "typos": flag("CODE") or flag("DOCS") or flag("CI"),
              "lychee": flag("DOCS"),
              "markdownlint": flag("DOCS"),
              "taplo": flag("CONFIG"),
              "pinact": flag("CI") or flag("ACTION"),
              "prek": flag("PRECOMMIT"),
              "complexity": flag("COMPLEXITY"),
              "shell-lint": flag("SHELL"),
              "python-lint": flag("CODE"),
              "action": flag("ACTION"),
              "prose": flag("DOCS"),
          }

          problems = []
          for name, should_run in expected.items():
              actual = needs[name]["result"]
              wanted = "success" if should_run else "skipped"
              if actual != wanted:
                  problems.append(f"{name}: got {actual}, expected {wanted}")
              else:
                  print(f"{name}: {actual} (expected)")

          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)

          print("lint jobs ran or skipped exactly as classified")
          PY
