name: Lint
# Workflow, YAML, and shell hygiene, plus this repo's own prose gate run against its
# own documentation.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install actionlint
        run: |
          set -euo pipefail
          version=1.7.7
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0
        env:
          BINSTALL_DISABLE_TELEMETRY: "true"
      - name: Install agnix
        run: cargo binstall agnix-cli@0.52.2 --no-confirm
      - name: Test staged agnix gate
        run: python3 scripts/test-agnix-hook.py
      - name: Check PR agnix inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse "${HEAD_SHA}^")"
          fi
          index="$(mktemp)"
          rm -f "$index"
          trap 'rm -f "$index"' EXIT
          export GIT_INDEX_FILE="$index"
          git read-tree "$HEAD_SHA"
          export AGNIX_DIFF_BASE="$base"
          ./scripts/check-agnix-staged.sh
      - name: actionlint
        run: actionlint .github/workflows/*.yml
      - name: Install zizmor
        run: pip install "zizmor==1.6.0"
      - name: zizmor
        run: zizmor .github/workflows/*.yml
      - name: Install yamllint
        run: pip install "yamllint==1.37.1"
      - name: yamllint
        run: yamllint -c .yamllint.yml .github/workflows/
  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: typos
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1
        with:
          files: .
          config: _typos.toml

  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config .lychee.toml --no-progress README.md
            packages/slopvac-lint/README.md packages/slopvac/README.md
            packages/slopvac-lint/docs packages/slopvac/skills
          lycheeVersion: v0.24.2
          fail: "true"

  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.18.1

  taplo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: taplo format
        run: uvx taplo@0.9.3 fmt --check
      - name: taplo check
        run: uvx taplo@0.9.3 check

  pinact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify action pins
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false"
          skip_push: "true"

  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0
      - name: Install typos
        run: cargo binstall typos-cli@1.50.1 --no-confirm
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # The prose hook is the same gate the action runs, so it needs the same
      # Vale: without one, Vale-owned rules fall back to the native engine and
      # the run exits 2 as incomplete.
      - name: Install vale
        run: ./scripts/install-vale.sh 3.15.2
      - name: Run configured hooks
        run: uvx prek@0.5.2 run --all-files

  lizard:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Measure source complexity
        run: uvx lizard==1.24.0 packages/slopvac-lint/src -C 15 -w

  shell-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find . -name '*.sh' -not -path './.git/*' -print0 |
            xargs -0 shellcheck --severity=warning
  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # `check` only, not `format`. The rule provenance comments in this package are
      # its documentation, and the formatter rewraps them; the selected rule set is
      # the part that finds defects. It has already found a dead version branch, two
      # duplicate set members that silently did nothing, and 16 `raise SystemExit`
      # calls inside `except` with no `from None`, each printing a chained traceback
      # over its own error message.
      #
      # The version is pinned. An unpinned linter turns a new release into a red
      # build on an untouched branch.
      - name: ruff
        working-directory: packages/slopvac-lint
        run: uvx ruff@0.16.3 check .
  # Runs this repo's own action against this repo, from the working tree rather
  # than a published tag. A composite action that breaks is only visible when it
  # is executed, and no unit test executes one.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # the SARIF upload
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # changed-files-only needs the merge base
      - name: Run the action on this repo's docs
        id: slopvac
        uses: ./ # zizmor: ignore[self-repository]
        with:
          paths: .
          config: slopvac.toml
          source: ./packages/slopvac-lint # the working tree, not the last release
          sarif: "true"
          fail-on-findings: "true"
      - name: Report what the action returned
        env:
          SCORE: ${{ steps.slopvac.outputs.score }}
          FINDINGS: ${{ steps.slopvac.outputs.findings }}
          ERRORS: ${{ steps.slopvac.outputs.errors }}
          PASSED: ${{ steps.slopvac.outputs.passed }}
          SARIF: ${{ steps.slopvac.outputs.sarif }}
        run: |
          set -euo pipefail
          echo "score=$SCORE findings=$FINDINGS errors=$ERRORS passed=$PASSED"
          # An empty output means the step exited before writing them, which is a
          # broken action reported as a clean run.
          test -n "$SCORE" || { echo "the action returned no score"; exit 1; }
          test -s "$SARIF" || { echo "the action wrote no SARIF"; exit 1; }
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$SARIF"
  prose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The gate step below runs the linter through uvx, which the runner image does not
      # carry. Without this the step exits 127 on `uvx: command not found`, after vale has
      # already installed and the styles have built.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install vale
        run: ./scripts/install-vale.sh 3.15.2
      - name: Gate this repo's own docs
        run: |
          set -euo pipefail
          # `docs/` is passed as a directory, not as a list of files. The two
          # specimen files inside it are excluded in `slopvac.toml`, so a new doc
          # is gated the moment it is added instead of being silently unchecked.
          uvx --from ./packages/slopvac-lint slopvac lint \
            README.md packages/slopvac-lint/README.md packages/slopvac/README.md \
            packages/slopvac/skills \
            packages/slopvac-lint/docs
  # The only required status check. Branch protection names this one job rather than
  # every job, so adding a job above needs no change to the protection rule.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - workflow-lint
      - typos
      - lychee
      - markdownlint
      - taplo
      - pinact
      - prek
      - shell-lint
      - python-lint
      - action
      - prose
    if: always()
    steps:
      - name: Verify every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # A skipped or cancelled job is not a pass. `always()` above is what lets
          # this job report at all when an upstream job failed.
          #
          # The results arrive through the environment rather than a pipe: a heredoc
          # would override piped stdin, which shellcheck reports as SC2259.
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["RESULTS"])
          failed = [n for n, job in needs.items() if job.get("result") != "success"]
          if failed:
              print(f"::error::these jobs did not succeed: {' '.join(failed)}")
              sys.exit(1)
          print("every job passed")
          PY
