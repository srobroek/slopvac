name: Markdown review inputs

on:
  pull_request:
    paths: ['.github/workflows/markdown-review-inputs.yml']

permissions:
  contents: read

concurrency:
  group: markdown-review-inputs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive tracked source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/markdown-review-inputs"
          git archive --format=zip --output="$RUNNER_TEMP/markdown-review-inputs/source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/markdown-review-inputs/commit.txt"
          python3 scripts/install_vale.py --prefix "$RUNNER_TEMP/markdown-review-inputs" 3.15.2
      - name: Upload review inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: markdown-review-inputs
          path: ${{ runner.temp }}/markdown-review-inputs/
          retention-days: 7
          if-no-files-found: error
