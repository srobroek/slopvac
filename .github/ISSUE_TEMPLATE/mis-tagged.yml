name: Slop tagged incorrectly
description: Report a finding with the wrong rule, severity, or span.
title: "[mis-tagged]: "
labels: [mis-tagged, needs-triage]
body:
  - type: markdown
    attributes:
      value: >-
        An AI agent filing a report MUST disclose itself: tick Reported by an AI
        agent and fill in Agent, Model, and Harness and version.
        Reports must not contain paths or file names. Do not include user names,
        host names, repository names, organization names, or other private data.
        For security vulnerabilities, use the private vulnerability report on
        the Security tab.
  - type: checkboxes
    id: reporter
    attributes:
      label: Reporter
      options:
        - label: Reported by an AI agent
          required: false
  - type: input
    id: agent
    attributes:
      label: Agent
      description: >-
        Agent product name, for example Claude Code, Codex, omp, Kiro, or Cursor. Write N/A when unknown.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: >-
        Record the active model name exactly as the harness reports it in its
        system prompt, context, or /model selection.
        Do not use self-description or config defaults. Write N/A when unavailable.
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness and version
      description: >-
        Use the harness's version command, for example claude --version, codex --version, or omp --version.
        Write N/A when unavailable.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: slopvac version
      description: "Output of `slopvac --version`."
    validations:
      required: true
  - type: dropdown
    id: latest
    attributes:
      label: Reproduces on the latest release
      description: >-
        Rerun the command with `uvx --from slopvac@latest
        slopvac ...`. If the latest release fixes it, upgrade instead of filing.
      options:
        - "Yes"
        - Not checked
    validations:
      required: true
  - type: checkboxes
    id: duplicates
    attributes:
      label: Duplicate search
      options:
        - label: I searched existing issues for duplicates
          required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Output of `slopvac doctor --format json`, which contains no paths.
      render: json
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: >-
        The exact command or commands you ran. Pipe the sample into
        `slopvac lint --stdin`. Do not include paths or file names.
      render: shell
    validations:
      required: true
  - type: input
    id: rule-id
    attributes:
      label: Rule ID
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Genre and profile
      description: >-
        Choose the genre from the matching row in `slopvac prime`'s Genres and profiles table.
        Get the profile from the `profile:` line in `slopvac lint --stdin --explain-config` output.
        Copy only that line.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Flagged text
      description: >-
        Paste the sample text itself. A local file path is not enough.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: Finding
      description: >-
        The finding object from `slopvac lint --stdin --format json`. Its
        path reads `<stdin>`.
      render: json
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: What is wrong
      multiple: true
      options:
        - Wrong rule
        - Wrong severity
        - Wrong span or location
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected finding
      description: The rule, severity, or span you expected.
    validations:
      required: true
