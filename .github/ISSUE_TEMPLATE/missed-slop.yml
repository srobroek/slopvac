name: Slop that slopvac missed
description: Report slop that no finding reports.
title: "[missed slop]: "
labels: [false-negative, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Agents may file only with the user's approval and must follow `slopvac prime report`.
        Leave out private, proprietary, and secret text. Give the smallest reproduction.
        Send security vulnerabilities through the private advisory form, not an issue.
  - type: dropdown
    id: reporter
    attributes:
      label: Reported by
      options:
        - A person
        - An AI agent, with the user's approval
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and model
      description: >-
        Agent name and model, for example `Claude Code, claude-sonnet-4-5`. Write `none` when no agent was involved.
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness and version
      description: >-
        For example omp 14.2, Claude Code 2.1, Codex CLI, Kiro, GitHub Action, pre-commit, or terminal.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: slopvac version
      description: "Output of `slopvac --version`."
    validations:
      required: true
  - type: dropdown
    id: latest
    attributes:
      label: Reproduces on the latest release
      description: >-
        Rerun the command with `uvx --from slopvac@latest
        slopvac ...`. If the latest release fixes it, upgrade instead of filing.
      options:
        - "Yes"
        - Not checked
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Output of `slopvac doctor --format json`. Home paths print as `~`."
      render: json
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command or commands you ran.
      render: shell
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Genre and profile
      description: "For example `reference`, `strict`. `slopvac lint --explain-config <file>` prints the profile."
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Missed text
      render: markdown
    validations:
      required: true
  - type: input
    id: expected-rule
    attributes:
      label: Rule that should fire
      description: Leave empty when you do not know. When no rule covers the pattern, use the new rule form.
    validations:
      required: false
  - type: textarea
    id: why
    attributes:
      label: Why this is slop
    validations:
      required: true
