name: New rule proposal
description: Propose a writing pattern that no existing rule covers.
title: "[new rule]: "
labels: [new-rule, needs-triage]
body:
  - type: markdown
    attributes:
      value: >-
        An AI agent filing a report MUST disclose itself: tick Reported by an AI
        agent and fill in Agent, Model, and Harness and version.
        Reports must not contain paths or file names. Do not include user names,
        host names, repository names, organization names, or other private data.
        For security vulnerabilities, use the private vulnerability report on
        the Security tab.
  - type: checkboxes
    id: reporter
    attributes:
      label: Reporter
      options:
        - label: Reported by an AI agent
          required: false
  - type: input
    id: agent
    attributes:
      label: Agent
      description: >-
        Agent product name, for example Claude Code, Codex, omp, Kiro, or Cursor. Write N/A when unknown.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: >-
        Record the active model name exactly as the harness reports it in its
        system prompt, context, or /model selection.
        Do not use self-description or config defaults. Write N/A when unavailable.
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness and version
      description: >-
        Use the harness's version command, for example claude --version, codex --version, or omp --version.
        Write N/A when unavailable.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: slopvac version
      description: "Output of `slopvac --version`."
    validations:
      required: true
  - type: dropdown
    id: latest
    attributes:
      label: Reproduces on the latest release
      description: >-
        Rerun the command with `uvx --from slopvac@latest
        slopvac ...`. If the latest release fixes it, upgrade instead of filing.
      options:
        - "Yes"
        - Not checked
    validations:
      required: true
  - type: checkboxes
    id: duplicates
    attributes:
      label: Duplicate search
      options:
        - label: I searched existing issues for duplicates
          required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Output of `slopvac doctor --format json`, which contains no paths.
      render: json
    validations:
      required: false
  - type: textarea
    id: command
    attributes:
      label: Command
      description: >-
        The exact command or commands you ran. Pipe the sample into
        `slopvac lint --stdin`. Do not include paths or file names.
      render: shell
    validations:
      required: false
  - type: textarea
    id: pattern
    attributes:
      label: Pattern
      description: Describe the writing pattern and why it reads as slop.
    validations:
      required: true
  - type: textarea
    id: bad-examples
    attributes:
      label: Examples that should fire
      render: markdown
    validations:
      required: true
  - type: textarea
    id: good-examples
    attributes:
      label: Examples that must not fire
      render: markdown
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Rule kind
      options:
        - Pattern (deterministic)
        - Judgement (reviewer question)
        - Unsure
    validations:
      required: true
  - type: dropdown
    id: genres
    attributes:
      label: Genres
      multiple: true
      options:
        - consumer
        - reference
        - change-comms
        - internal
        - informal
    validations:
      required: false
  - type: input
    id: related
    attributes:
      label: Related existing rules
    validations:
      required: false
  - type: textarea
    id: source
    attributes:
      label: Evidence or source
    validations:
      required: false
