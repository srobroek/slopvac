name: Bug report
description: Report a crash, incorrect result, or broken behavior.
title: "[bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: >-
        An AI agent filing a report MUST disclose itself: tick Reported by an AI
        agent and fill in Agent, Model, and Harness and version.
        Reports must not contain paths. File names may only be `repro.md` and
        `slopvac.toml`. Do not include user names, host names, repository names,
        organization names, or other private data.
        For security vulnerabilities, use the private vulnerability report on
        the Security tab.
  - type: checkboxes
    id: reporter
    attributes:
      label: Reporter
      options:
        - label: Reported by an AI agent
          required: false
  - type: input
    id: agent
    attributes:
      label: Agent
      description: >-
        Agent product name, for example Claude Code, Codex, omp, Kiro, or Cursor. Write N/A when unknown.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: >-
        Record the active model name exactly as the harness reports it in its
        system prompt, context, or /model selection.
        Do not use self-description or config defaults. Write N/A when unavailable.
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness and version
      description: >-
        Use the harness's version command, for example claude --version, codex
        --version, or omp --version. Write N/A when unavailable.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: slopvac version
      description: "Output of `slopvac --version`."
    validations:
      required: true
  - type: dropdown
    id: latest
    attributes:
      label: Reproduces on the latest release
      description: >-
        Rerun the command with `uvx --from slopvac@latest
        slopvac ...`. If the latest release fixes it, upgrade instead of filing.
      options:
        - "Yes"
        - Not checked
    validations:
      required: true
  - type: checkboxes
    id: duplicates
    attributes:
      label: Duplicate search
      options:
        - label: I searched existing issues for duplicates
          required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Output of `slopvac doctor --format json`, which contains no paths.
      render: json
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: >-
        The exact command or commands you ran. Name the sample `repro.md`. Do
        not include other paths or file names.
      render: shell
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: stderr, traceback, or report excerpt
      render: text
    validations:
      required: false
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant `slopvac.toml` lines.
      render: toml
    validations:
      required: false
