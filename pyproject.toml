[project]
name = "slopvac-workspace"
version = "0.0.0"
description = "Repository workspace configuration for Slopvac"
requires-python = ">=3.11"
dependencies = ["slopvac"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[tool.uv]
package = false

[tool.uv.sources]
slopvac = { workspace = true }

[tool.uv.workspace]
members = ["packages/slopvac-lint"]

[tool.pytest.ini_options]
testpaths = ["packages/slopvac-lint/tests", "tests"]
addopts = "-q"
pythonpath = ["."]

[dependency-groups]
profile = [
  "line-profiler>=5.1.0",
  "memray>=1.20.0",
  "py-spy>=0.4.2",
  "pyinstrument>=5.1.3",
  "scalene>=2.3.0",
  "tuna>=0.5.15",
  "viztracer>=1.1.1",
]
