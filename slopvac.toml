# The prose gate for this repository, applied by the `prose` job in .github/workflows/lint.yml.
#
# Eight Simplified Technical English categories are set to suggestion severity
# below. `ste-safety` keeps its normal error severity. At the `normal` profile,
# the suggestions are report-only; they do not fail ordinary thresholds.
# STE is written for aircraft maintenance procedures: one clause per sentence,
# a controlled vocabulary, no coordinated lists in a sentence. That suits a
# runbook and not a README explaining what a rule catches and why it exists.
#
# At `normal`, advisory AI rules report as suggestions. Other AI findings can fail
# a configured gate when its threshold is exceeded; a match does not guarantee
# that the run fails.
profile = "normal"

exclude = [
  "**/node_modules/**",
  "**/apm_modules/**",
  "**/.venv/**",
  "**/dist/**",
  "**/build/**",
  "**/.pytest_cache/**",
  # Generated by `slopvac reference` from the rule sources. Edit those sources,
  # then regenerate the document. This generated file is excluded from the gate.
  "packages/slopvac-lint/docs/rules.md",
  "packages/slopvac-lint/tests/fixtures/**",
  # Generated by other tools: release-please writes CHANGELOG.md, `bd init`
  # writes .beads/README.md, and .agents/skills/beads is the vendored bd skill.
  "CHANGELOG.md",
  ".beads/**",
  ".agents/**",
]

[thresholds]
max_errors = 0

# --- Simplified Technical English --------------------------------------------
[categories.ste-descriptive]
severity = "suggestion"

[categories.ste-nouns]
severity = "suggestion"

[categories.ste-practices]
severity = "suggestion"

[categories.ste-procedural]
severity = "suggestion"

[categories.ste-punctuation]
severity = "suggestion"

[categories.ste-sentences]
severity = "suggestion"

[categories.ste-verbs]
severity = "suggestion"

[categories.ste-words]
severity = "suggestion"

# The score combines weighted category scores and a bounded suggestion penalty.
# This README override disables the minimum-score gate. Error and category
# thresholds still apply, and the score remains in reports.
[[overrides]]
files = ["**/README.md"]

[overrides.thresholds]
max_errors = 0
min_score = 0
