# The prose gate for this repository, applied by the `prose` job in .github/workflows/lint.yml.
#
# `normal`, with the Simplified Technical English categories demoted to advisory. STE is written
# for aircraft maintenance procedures: one clause per sentence, a controlled vocabulary, no
# coordinated lists in a sentence. That suits a runbook and not a README explaining what a rule
# catches and why it exists. Measured on this repository's three READMEs: 132 findings, zero
# errors, and the failures were the score floor and one density budget rather than any error.
#
# The slop rules keep their `normal` severity, so a real AI tell still fails the gate.
profile = "normal"

exclude = [
  "**/node_modules/**",
  "**/apm_modules/**",
  "**/.venv/**",
  "**/dist/**",
  "**/build/**",
  # Generated by `slopvac reference`. It quotes every tell verbatim as its own documentation, so
  # the linter reads 530 specimens as 530 errors, and a fix would have to be made in a generator
  # that has no prose to fix.
  "packages/slopvac-lint/docs/rules.md",
  # The rest of `docs/`, named one file at a time rather than as `docs/**`. The blanket form was
  # wider than its own justification: of the eleven files, only `rules.md` and
  # `orwell-derivation.md` quote their own specimens, and the other nine carried 0-3 errors each.
  # `migration.md` (62.0 -> 89.7) and `exclusions.md` (61.8 -> 75.0) were fixed and are now gated.
  # Each file below still needs its own measurement before it comes out; the list is the work
  # queue.
  #
  # Blockquotes Orwell at length. His sentences are the corpus the rules were written against, so
  # the gate reads the source material back as 26 errors. Measured at 57.6.
  "packages/slopvac-lint/docs/orwell-derivation.md",
  # Tables the regex patterns it documents, so the patterns' own flagged terms are the content.
  "packages/slopvac-lint/docs/vale-traps.md",
  # Design notes and coverage tables, not shipped prose. Measured 68.1, 71.0, 75.1, 76.4, 79.0,
  # and 83.1 against a 70.0 floor, with three errors spread across the first three.
  "packages/slopvac-lint/docs/domain-categories.md",
  "packages/slopvac-lint/docs/coverage.md",
  "packages/slopvac-lint/docs/counter-signals.md",
  "packages/slopvac-lint/docs/ste-principles.md",
  "packages/slopvac-lint/docs/triage.md",
  "packages/slopvac-lint/docs/metrics.md",
  #
  # Demoting a category per file was tried first and does not work: a category cap lowers a rule's
  # severity but the finding still counts toward `max_errors`, so the files reported zero score
  # failures and 29 errors. Naming the files is the honest version of the same decision.
]

[thresholds]
max_errors = 0

# --- Simplified Technical English --------------------------------------------
[categories.ste-descriptive]
severity = "suggestion"

[categories.ste-nouns]
severity = "suggestion"

[categories.ste-practices]
severity = "suggestion"

[categories.ste-procedural]
severity = "suggestion"

[categories.ste-punctuation]
severity = "suggestion"

[categories.ste-sentences]
severity = "suggestion"

[categories.ste-verbs]
severity = "suggestion"

[categories.ste-words]
severity = "suggestion"

# --- The rules documentation --------------------------------------------------
# `vale-styles/README.md` documents what each rule catches, so its tables quote the tells
# verbatim: "We chose Python for the hook", "The earlier implementation spawned a shell per
# check". The linter reads those examples as the real thing and reported prose-scope at 1.22 per
# 100 words against a 0.6 budget.
#
# A rule cannot tell a specimen from an instance, and rewording the examples would make the
# documentation stop demonstrating the rule. Advisory here only, so the same rules still gate
# every other document in the repository.
[[overrides]]
files = ["packages/slopvac-lint/vale-styles/README.md"]

# `max_per_100_words` as well as the severity: demoting the severity alone leaves the category's
# density budget in force, which is what still failed at 1.22 against 0.6.
[overrides.categories.prose-scope]
severity = "suggestion"
max_per_100_words = 100.0

[overrides.categories.prose-inflation]
severity = "suggestion"

[overrides.categories.prose-promotion]
severity = "suggestion"

# --- The score floor ----------------------------------------------------------
# A README is mostly headings, tables, and short paragraphs, which is the shape the score
# penalises: the floor is a density measure and these files are dense by design. Errors still
# gate them, and every category above still reports.
[[overrides]]
files = ["**/README.md"]

[overrides.thresholds]
max_errors = 0
min_score = 0
