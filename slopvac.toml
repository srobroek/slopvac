# The prose gate for this repository, applied by the `prose` job in .github/workflows/lint.yml.
#
# `normal`, with the Simplified Technical English categories demoted to advisory. STE is written
# for aircraft maintenance procedures: one clause per sentence, a controlled vocabulary, no
# coordinated lists in a sentence. That suits a runbook and not a README explaining what a rule
# catches and why it exists. Measured on this repository's three READMEs: 132 findings, zero
# errors, and the failures were the score floor and one density budget rather than any error.
#
# The slop rules keep their `normal` severity, so a real AI tell still fails the gate.
profile = "normal"

exclude = [
  "**/node_modules/**",
  "**/apm_modules/**",
  "**/.venv/**",
  "**/dist/**",
  "**/build/**",
  "**/.pytest_cache/**",
  # Generated by `slopvac reference`. It quotes every tell verbatim as its own documentation, so
  # the linter reads 530 specimens as 530 errors, and a fix would have to be made in a generator
  # that has no prose to fix.
  "packages/slopvac-lint/docs/rules.md",
  # Blockquotes Orwell at length. His sentences are the corpus the rules were written against, so
  # the gate reads the source material back as 26 errors. Measured at 57.8.
  "packages/slopvac-lint/docs/orwell-derivation.md",
  # Specimens, not prose this repository writes: eval prompts and the documents agents produced
  # from them, the dogfood transcripts, and rule fixtures. Their slop is the measurement.
  "evals/topics.md",
  "evals/runs/**",
  "evals/independent/**",
  ".dogfood-cleanroom/**",
  "packages/slopvac-lint/tests/fixtures/**",
  # The record of the Vale generation that 2.0 replaced, kept as history behind a banner. Its
  # wording is the record; docs/rules.md is the current reference.
  "packages/slopvac-lint/docs/coverage.md",
  "packages/slopvac-lint/docs/exclusions.md",
  "packages/slopvac-lint/docs/migration.md",
  # Generated by other tools, whose templates own the wording: release-please writes CHANGELOG.md,
  # `bd init` writes .beads/README.md, and .agents/skills/beads is the vendored bd skill.
  "CHANGELOG.md",
  ".beads/**",
  ".agents/**",
  #
  # The nine other files under `docs/` are NOT excluded. The blanket `docs/**` form was wider than
  # its own justification: only the two files above quote their own specimens, and every other file
  # now passes and is gated by the `prose` job. Three of them needed a rewrite; the rest were
  # failing on linter defects rather than their prose, and fixing the defects was the real work:
  #
  #   - a `-ly` pattern with no adverb test flagged `family-friendly` and `supply-chain`
  #   - the Vale heading-hierarchy script counted a `#` comment inside a fence as an h1
  #   - Vale matched `scope: prose` rules inside inline code, which the native engine masks
  #
  # Demoting a category per file was tried first and does not work: a category cap lowers a rule's
  # severity but the finding still counts toward `max_errors`, so the files reported zero score
  # failures and 29 errors. Naming the files is the honest version of the same decision.
]

[thresholds]
max_errors = 0

# --- Simplified Technical English --------------------------------------------
[categories.ste-descriptive]
severity = "suggestion"

[categories.ste-nouns]
severity = "suggestion"

[categories.ste-practices]
severity = "suggestion"

[categories.ste-procedural]
severity = "suggestion"

[categories.ste-punctuation]
severity = "suggestion"

[categories.ste-sentences]
severity = "suggestion"

[categories.ste-verbs]
severity = "suggestion"

[categories.ste-words]
severity = "suggestion"

# --- Internal genre -----------------------------------------------------------
# The eval report cites commits and decision records by design and says which alternative lost;
# the skill references describe ADRs, specs, and PR bodies because they teach agents to write
# them. `docs-discipline` and `prose-scope` are consumer-doc rules, advisory here.
[[overrides]]
files = ["evals/REPORT.md", "packages/slopvac/skills/**"]

[overrides.categories.docs-discipline]
severity = "suggestion"

[overrides.categories.prose-scope]
severity = "suggestion"

# --- The score floor ----------------------------------------------------------
# A README is mostly headings, tables, and short paragraphs, which is the shape the score
# penalises: the floor is a density measure and these files are dense by design. Errors still
# gate them, and every category above still reports.
[[overrides]]
files = ["**/README.md"]

[overrides.thresholds]
max_errors = 0
min_score = 0
