timeout = 20
max_retries = 2

# 429 is a CI rate limit, not a dead link, and treating it as one makes the job
# fail on the runner's IP rather than on this repository's content.
accept = [200, 429]
accept_timeouts = true

# Verbatim adversarial-review reports stored as evidence under the research record; their
# citations are not edited (dead ones are marked unsupported inside the files), so they are
# not link-checked. The two authored files beside them are checked.
exclude_path = [
  "packages/slopvac-lint/docs/research/rubric-2026-09-15/challenges",
]

exclude = [
  # lychee cannot verify an in-page anchor on a rendered GitHub file.
  "github\\.com.*#[a-z]",
  # Placeholders in examples, not addresses anyone can reach.
  "localhost",
  "example\\.com",
  # Medium serves 403 to any non-browser client, so the check reports a live
  # article as dead. `docs/rules.md` cites one as a rule source.
  "medium\\.com",
  # The Orwell archive intermittently returns Cloudflare 522 to CI link checkers.
  "orwell\\.ru",
  # The same 403-to-non-browser behaviour from two publishers and the SEC, cited as
  # primary sources by docs/research/rubric-2026-09-15/rubric-review.md.
  "journals\\.sagepub\\.com",
  "doi\\.org/10\\.1111/",
  "www\\.sec\\.gov/pdf/handbook\\.pdf",
  # These cited source pages return 403 to lychee's non-browser HTTP client.
  "support\\.acrolinx\\.com/hc/en-us/articles/10210995244178",
  "www\\.iso\\.org/standard/79077\\.html",
  "www\\.iso\\.org/sites/directives/current/part2/index\\.xhtml",
]
