timeout = 20
max_retries = 2

# 429 is a CI rate limit, not a dead link, and treating it as one makes the job
# fail on the runner's IP rather than on this repository's content.
accept = [200, 429]
accept_timeouts = true

exclude = [
  # lychee cannot verify an in-page anchor on a rendered GitHub file.
  "github\\.com.*#[a-z]",
  # Placeholders in examples, not addresses anyone can reach.
  "localhost",
  "example\\.com",
  # Medium serves 403 to any non-browser client, so the check reports a live
  # article as dead. `docs/rules.md` cites one as a rule source.
  "medium\\.com",
  # The same 403-to-non-browser behaviour from two publishers and the SEC, cited as
  # primary sources by docs/research/rubric-2026-09-15/rubric-review.md.
  "journals\\.sagepub\\.com",
  "doi\\.org/10\\.1111/",
  "www\\.sec\\.gov/pdf/handbook\\.pdf",
  # Standards bodies and publishers cited as evidence in the research record's verbatim
  # challenge reports; each serves 403 to non-browser clients.
  "www\\.iso\\.org/",
  "direct\\.mit\\.edu/",
  "www\\.tandfonline\\.com/",
  "ansi\\.org/",
  "support\\.acrolinx\\.com/",
  "help\\.smartling\\.com/",
  # Three citations in the verbatim challenge reports were dead at review time (404);
  # the reports are evidence records and are not edited.
  "inspect\\.aisi\\.org\\.uk/logs\\.html",
  "commission\\.europa\\.eu/resources-partners/clear-writing_en",
  "press\\.uchicago\\.edu/ucp/books/book/chicago/L/bo3684275\\.html",
  # Three W3C citations in challenges/ProtectedClassesLit.md were dead at review time; the
  # file's verification note marks those evidence items unsupported.
  "www\\.w3\\.org/International/questions/qa-i18n-glossary",
  "www\\.w3\\.org/standards/history/mqm/",
  "www\\.w3\\.org/TR/its21/",
]
