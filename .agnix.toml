# Agent-configuration validation. Exclude generated and fixture trees.
severity = "Warning"
exclude = [
  "node_modules/**",
  ".git/**",
  "dist/**",
  "target/**",
  ".apm/**",
  "**/.apm/**",
  ".agents/**",
  "**/.agents/**",
  "**/tests/fixtures/**",
  ".beads/**",
]

[rules]
disabled_rules = []
disabled_validators = []

[files]
include_as_generic = []
