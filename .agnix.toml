# agnix 0.52.2 configuration for the Slopvac repository.
# Exclude generated, fixture, managed, and legacy trees that are not agent configuration.
severity = "Warning"
exclude = [
  "node_modules/**",
  ".git/**",
  "dist/**",
  "target/**",
  ".apm/**",
  "**/.apm/**",
  ".agents/**",
  "**/.agents/**",
  "**/tests/fixtures/**",
  ".beads/**",
]

[rules]
disabled_rules = []
disabled_validators = []
