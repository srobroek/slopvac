# Average sentence length across a document.
#
#   words / sentences
#
# The oldest and least glamorous readability variable, and it appears in every
# formula from Flesch (1948) onward. Here it is used ALONE and unweighted, because
# every attempt to combine it with a vocabulary term reintroduces the confound
# documented in Overwritten.yml.
#
# --- Why not McAlpine EFLAW ----------------------------------------------------
#
# McAlpine EFLAW (2006) is `(words + words_of_3_letters_or_fewer) / sentences`. An
# earlier revision of this file said it "cannot be implemented here" because Vale's
# `metric` check has no short-word variable. That was wrong: `extends: script` runs
# Tengo over the raw text and can count them, and a prototype matched the `textstat`
# reference implementation exactly (65.0 on both). See PassiveDensity.yml, which uses
# that mechanism.
#
# EFLAW is not used because it is a BAD MODEL, not because it is unavailable. Since
# short_words <= words, EFLAW is algebraically `words/sentence * (1 + short_share)`,
# and short_share barely varies -- CV 0.173 across 179 human technical documents. The
# consequences, measured:
#
#   corr(EFLAW, words/sentence)     0.985
#   corr(EFLAW, short-word share)  -0.044
#
# EFLAW is average sentence length with a rounding error. On a graded corpus of human
# technical docs ordered by audience it scores rho = -0.12, and on a control pair of
# bad-but-short versus good-but-long prose it inverts completely (AUC 0.000).
#
# An earlier revision also cited a 288:1 signal-to-confound ratio in EFLAW's favour.
# That came from three paragraphs written by hand for the test, one of which happened
# to be a long sentence -- so it rewarded a length metric for detecting length. It is
# not evidence and should not have been recorded as such.
#
# --- What this rule is, and is not --------------------------------------------
#
# It is NOT a difficulty measure. Against the graded human corpus, average sentence
# length ranks rho = -0.13: the git tutorial has longer sentences than RFC 7231. No
# threshold on it separates a tutorial from a specification.
#
# It IS an outlier catch, and it covers the one case RIX misses. On "The loader will
# read the file and then it will try again and then it will give up and log the error
# to the file that you set in the config" RIX scores 1.0 -- almost no long words --
# while this scores 38. Kept as two rules rather than one formula so a finding says
# which defect it found.
#
# Threshold 33 is p95 of 179 human technical documents (p75 = 25.7, p90 = 30.0), and
# fires on 0 of the 11 graded samples. prose-craft.SentenceLength flags the individual
# sentence at 34 words; this flags a document whose AVERAGE is that high.
extends: metric
message: "sentence load: %s words per sentence on average (over 33) — split the long ones"
level: warning
link: https://github.com/srobroek/slopvac/blob/main/vale-styles/README.md
formula: |
  words / sentences
condition: "> 33"
