# RIX (Anderson 1983): long words per sentence.
#
#   RIX = long_words / sentences        long word = 7 or more letters
#
# This is a PUBLISHED metric, not a house formula. Anderson derived it from
# Björnsson's LIX (1968) by replacing LIX's sum of two ratios with the single ratio
# that carries the signal. Implemented as `rix` in the `textstat` reference library,
# where the docstring notes Anderson specifies punctuation removed and hyphenated
# sequences counted as one word.
#
# An earlier revision of this file used `(words/sentences) * (long_words*100/words)`,
# derived from scratch. That expression simplifies to `100 * long_words / sentences`
# -- exactly 100x RIX. Verified numerically as well as algebraically. Citing the
# published form instead means the threshold can be compared against published work
# and a reader can look the metric up.
#
# --- Why not Flesch-Kincaid, which every style guide ships -------------------
#
# FK is `0.39*(w/s) + 11.8*(syllables/word) - 15.59`, and the syllable term carries
# 30x the weight. Measured across 179 human-written technical documents (the
# upstream Vale style repos: Google, Red Hat, Elastic, Splunk, IBM, Canonical), FK
# correlates r=0.89 with syllables-per-word and only r=0.44 with sentence length --
# so it mostly reports which words the subject matter requires. Technical vocabulary
# has no shorter synonym: `configuration` is 5 syllables, `initialization` 6.
#
#   "Initialization happens asynchronously. The orchestration layer waits."
#     3.5 words/sentence, about as short and active as English gets -> FK 19.5
#   FK < 8, the threshold the Readability package ships, flags 93% of the corpus.
#
# Every metric was benchmarked on a matched pair: a GOOD technical paragraph and a
# GOOD plain-English one, same quality, different domain. The gap a metric opens
# between them is its confound; the gap to a genuinely over-written paragraph is its
# signal. Ratio of signal to confound, and correlation with vocabulary:
#
#   metric              ratio   r(vocab)
#   McAlpine EFLAW     288.00      -0.12   <- see SentenceLoad.yml
#   Linsear Write       12.12       0.12
#   RIX                  6.18       0.25   <- this rule
#   SMOG                 1.56       0.39
#   Gulpease             1.25      -0.87
#   Flesch-Kincaid       0.85       0.89
#   ARI                  0.77       0.89
#   Gunning Fog          0.68       0.46
#   LIX                  0.53       0.40
#   Flesch Reading Ease  0.31      -0.98
#   Coleman-Liau         0.04       0.97
#   Dale-Chall          -0.12              <- inverted: scores the BAD text easier
#
# Coleman-Liau and Flesch Reading Ease are near-pure vocabulary measures (|r| 0.97
# and 0.98) and cannot be used here at any threshold. Dale-Chall scores the
# over-written paragraph as EASIER than the good ones, because its 3,000-word
# familiarity list contains `utilization` and `implementation` but not `stderr`.
#
# Threshold 9 is p90 of the human corpus. Recalibrate against your own before
# changing it: the number is measured, not chosen.
extends: metric
message: "dense prose: %s long words per sentence (over 9) — replace the nominalisations with verbs"
level: warning
link: https://github.com/srobroek/slopvac/blob/main/vale-styles/README.md
formula: |
  long_words / sentences
condition: "> 9"
