# The lecturer voice: observations delivered from above the scene, with nobody
# in it. The fix is to put the reader in the room, or name who acted.
#
# The opener forms are anchored to line start, because these phrases are a tell
# only in that position: "what people tend to forget is documented in the
# runbook" mid-sentence is ordinary prose.
extends: existence
message: "narrator-from-a-distance: %s — put the reader in the scene, or name who acted"
level: error
link: https://github.com/srobroek/slopvac/blob/main/vale-styles/README.md
raw:
  - '(?m)^\s*(?:[-*]\s+|>\s+)?(?:[Ll]ook,|[Ss]ee,|[Ll]isten,)\s|'
  - '\b(?:[Pp]eople|[Ee]ngineers|[Dd]evelopers|[Tt]eams|[Uu]sers|[Mm]ost folks)'
  - '\s+tend to\b|'
  - '\b[Nn]obody\s+(?:designed|planned|intended|chose|decided|asked for)\b|'
  - '\b(?:[Ee]veryone|[Nn]obody|[Nn]o one)\s+(?:knows|thinks|assumes|believes|wants)\b'
