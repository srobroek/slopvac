# Over-writing: internal implementation facts the reader of this document cannot
# act on -- measured timings, process counts, and the cost of the machinery.
#
# A configuration default, a documented limit, and a stated performance guarantee
# are all actionable, and none of them match here. What matters is the frame: a
# measurement presented as prose about how the code performs is a benchmark
# result, and a benchmark result in a document ages into a false claim. It belongs
# in the commit that made it true.
#
# A unit must sit next to the number, so version strings, ports, exit codes, and
# byte sizes in a configuration table stay clean. A stated ceiling is a documented
# limit, not a benchmark, so "at most five subprocesses" and "five subprocesses run
# concurrently" are both excluded.
#
# `scope: paragraph` skips tables and list items, which is where a published
# figure belongs: a benchmarks page with its measurement conditions and a
# reproduction command is a deliverable, not a leak. Measured over an external
# corpus, 100 of 154 matches were table rows or list items, all of them
# legitimate. The rule keeps the case it is for -- a timing asserted mid-sentence
# about how the implementation performs.
#
# A duration that names a timeout, budget, or deadline is configuration the reader
# acts on ("the adapter gives the daemon 50 ms"), so it is excluded, as is a figure
# inside an HTML `<dd>` stat tile.
#
# A product whose value IS its latency should turn this rule off rather than fight
# it; see the note in vale-styles/README.md.
extends: existence
scope: paragraph
message: "implementation leak: %s — the reader cannot act on this; move it to the commit, ADR, or spec"
level: error
link: https://github.com/srobroek/agentic-packages/blob/main/vale-styles/README.md
ignorecase: true
raw:
  - '(?<!<dd>)(?<![Tt]imeout of )(?<![Bb]udget of )(?<![Dd]eadline of )(?<![Ll]imit of )(?<![Ww]ithin )(?<![Aa]fter )(?<![Ee]very )\b\d+(?:\.\d+)?\s?(?:ms|milliseconds?|µs|microseconds?|ns|nanoseconds?)\b(?![^.!?]{0,30}\b(?:timeout|budget|deadline|limit|allowance|before (?:giving up|falling back))\b)|'
  - '\b\d+(?:\.\d+)?\s?(?:s|sec|seconds?)\s+(?:per|each|faster|slower)\b|'
  - '\b\d+(?:\.\d+)?x\s+(?:faster|slower|speedup|the (?:speed|cost))\b|'
  - '(?<!at most )(?<!maximum of )(?<!up to )\b(?:one|two|three|four|five|six|seven|eight|nine|ten|\d+)\s+(?:process(?:es)?|spawns?|subprocess(?:es)?|forks?|syscalls?|round[- ]trips?|invocations?|shell[- ]outs?)\b(?![^.!?]{0,25}\b(?:limit|maximum|concurrently|at a time)\b)|'
  - '\bcosts? (?:one|two|three|a single|only) \w+ (?:startup|spawn|call|process)\b|'
  - '\bzero (?:spawns?|subprocess(?:es)?|allocations?)\b'
