# A cross-reference that depends on where the text landed on the page.
#
# "see below", "the table above", "in the right-hand panel". Position breaks for
# every reader who zooms, reflows, uses a screen reader, or reads the rendered
# page in a different order than the source -- WCAG 2.2 SC 1.3.3. It also breaks
# for the reader of a single section extracted into search results or an AI
# summary, which is most readers now.
#
# Modelled on Elastic's DirectionalLanguage rather than neighbor's: neighbor
# matches a bare `bar` via `(side)?bar`, which fired on the word "bar" in
# ordinary prose. Every entry here needs a directional word.
extends: substitution
message: "directional reference: use '%s' instead of '%s', or link the heading by name"
level: warning
link: https://www.w3.org/WAI/WCAG22/Understanding/sensory-characteristics
ignorecase: true
swap:
  # Forward references.
  '(?:as )?(?:shown|described|outlined|listed|defined|detailed|specified|explained|discussed|noted) below': 'in the following section'
  'the below (?:table|section|figure|diagram|image|example|list|code|command|step)s?': 'the following one'
  '(?:the |this )?(?:table|section|figure|diagram|example|screenshot|chart|step|command|code) below': 'the following one'
  'see below': 'see the named section'

  # Back references.
  '(?:as )?(?:shown|described|outlined|listed|defined|detailed|specified|explained|discussed|mentioned|noted) above': 'earlier on this page'
  'the above (?:table|section|figure|diagram|image|example|list|code|command|step)s?': 'the preceding one'
  '(?:the |this )?(?:table|section|figure|diagram|example|screenshot|chart|step|command|code) above': 'the preceding one'
  'see above': 'see the named section'

  # Screen position. `\b` on each side so "left-shift" and "rights" stay clean.
  '(?:to|on|in) the (?:left|right)(?: side)?(?: of)?': 'the named element'
  '(?:left|right)[- ]hand side': 'the named element'
  '(?:left|right) side of the (?:page|screen|window)': 'the named element'
  'in the (?:left|right) (?:column|panel|sidebar|nav|navigation|menu|pane)': 'the named element'
  'scroll (?:left|right)': 'the named element'
